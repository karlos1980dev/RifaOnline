<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jogo da Memória - Animação + Reinício</title>
<style>
    body{
        background:#111;
        color:#fff;
        font-family:Arial;
        text-align:center;
        overflow-x:hidden;
    }
    h1{ margin-top:20px; font-size:18px;}

    .placar{
        display:flex;
        justify-content:center;
        margin-top:10px;
        gap:20px;
        font-size:20px;
    }

    .ativo{
        color:#0f0;
        font-weight:bold;
        text-decoration:underline;
    }

    .tabuleiro{
        width:320px;
        margin:10px auto;
        display:grid;
        grid-template-columns:repeat(4, 1fr);
        gap:10px;
    }
    .carta{
        width:65px;
        height:65px;
        background:#222;
        border:2px solid #555;
        border-radius:10px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:35px;
        cursor:pointer;
        user-select:none;
        transition:0.3s;
    }
    .virada{
        background:#fff;
        color:#000;
        transform:scale(1.1);
    }
    .par-encontrado{
        background:#0f0;
        color:#000;
        border-color:#0f0;
        transform:scale(1.1);
    }

    button{
        padding:10px 20px;
        font-size:18px;
        background:#444;
        border:none;
        color:#fff;
        border-radius:8px;
        cursor:pointer;
        margin-top:10px;
    }
    button:hover{
        background:#666;
    }

    /* ANIMAÇÃO DE GANHOU */
    #ganhou{
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.8);
        color:#fff;
        font-size:45px;
        display:flex;
        justify-content:center;
        align-items:center;
        text-shadow:0 0 20px #fff;
        opacity:0;
        pointer-events:none;
        transition:0.5s;
        z-index:999;
    }

    #ganhou.mostrar{
        opacity:1;
        animation: brilho 1s infinite alternate;
    }

    @keyframes brilho{
        from{ text-shadow:0 0 10px #0f0; }
        to{ text-shadow:0 0 25px #0f0; }
    }
</style>
</head>
<body>

<h1>🧠 Jogo da Memória</h1>

<div class="placar">
    <div id="j1" class="ativo">Jogador 1: <span id="p1">0</span></div>
    <div id="j2">Jogador 2: <span id="p2">0</span></div>
</div>

<button onclick="reiniciar()">🔄 Reiniciar Jogo</button>

<div class="tabuleiro" id="tabuleiro"></div>

<!-- ANIMAÇÃO DE VITÓRIA -->
<div id="ganhou">🎉 PARABÉNS! VOCÊ ACERTOU 7 COMBINAÇÕES! 🎉</div>

<script>
    const emojisOriginais = [
     "🍎","🍌","🍒","🍇","🍉","🍓",
        "🍍","🥝","🍑","🥥","🍋","🍊"
        ];

    let primeira = null;
    let segunda = null;
    let trava = false;

    let jogadorAtual = 1;
    let pontos1 = 0;
    let pontos2 = 0;

    let totalAcertos = 0; // conta acertos

    function iniciarJogo(){
        const tabuleiro = document.getElementById("tabuleiro");
        tabuleiro.innerHTML = "";

        totalAcertos = 0;

        let cartas = [...emojisOriginais, ...emojisOriginais];
        cartas.sort(() => Math.random() - 0.5);

        cartas.forEach((emoji)=>{
            const div = document.createElement("div");
            div.classList.add("carta");
            div.dataset.valor = emoji;
            div.addEventListener("click", virarCarta);
            tabuleiro.appendChild(div);
        });
    }

    function virarCarta(){
        if (trava) return;
        if (this.classList.contains("virada")) return;

        this.classList.add("virada");
        this.textContent = this.dataset.valor;

        if (!primeira){
            primeira = this;
        } else {
            segunda = this;
            verificaPar();
        }
    }

    function verificaPar(){
        trava = true;

        if (primeira.dataset.valor === segunda.dataset.valor){
            primeira.classList.add("par-encontrado");
            segunda.classList.add("par-encontrado");

            totalAcertos++;

            // Quando fizer 7 combinações → mostrar animação e reiniciar
            if (totalAcertos === "11"){
                animacaoGanhou();
            }

            if (jogadorAtual === 1){
                pontos1++;
                document.getElementById("p1").textContent = pontos1;
            } else {
                pontos2++;
                document.getElementById("p2").textContent = pontos2;
            }

            limparSelecao();

        } else {
            setTimeout(()=>{
                primeira.classList.remove("virada");
                segunda.classList.remove("virada");
                primeira.textContent = "";
                segunda.textContent = "";

                trocarJogador();
                limparSelecao();
            }, 800);
        }
    }

    function limparSelecao(){
        primeira = null;
        segunda = null;
        trava = false;
    }

    function trocarJogador(){
        jogadorAtual = jogadorAtual === 1 ? 2 : 1;

        document.getElementById("j1").classList.remove("ativo");
        document.getElementById("j2").classList.remove("ativo");

        if (jogadorAtual === 1){
            document.getElementById("j1").classList.add("ativo");
        } else {
            document.getElementById("j2").classList.add("ativo");
        }
    }

    function reiniciar(){
        primeira = null;
        segunda = null;
        trava = false;

        jogadorAtual = 1;
        pontos1 = 0;
        pontos2 = 0;
        totalAcertos = 0;

        document.getElementById("p1").textContent = 0;
        document.getElementById("p2").textContent = 0;

        document.getElementById("j1").classList.add("ativo");
        document.getElementById("j2").classList.remove("ativo");

        document.getElementById("ganhou").classList.remove("mostrar");

        iniciarJogo();
    }

    // ANIMAÇÃO + REINÍCIO AUTOMÁTICO
    function animacaoGanhou(){
        const msg = document.getElementById("ganhou");
        msg.classList.add("mostrar");

        // AGUARDA 3s E REINICIA SOZINHO
        setTimeout(()=>{
            msg.classList.remove("mostrar");
            reiniciar();
        }, 3000);
    }

    iniciarJogo();
</script>

</body>
</html>
