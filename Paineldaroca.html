<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>🍎 Painel Coisa da Roca</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#ecfdf5,#f1f5f9);
  padding:20px;
}

h1{color:#065f46}

/* CARD PEDIDO */
.pedido{
  background:#fff;
  padding:15px;
  border-radius:16px;
  margin-bottom:15px;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}

/* STATUS */
.status{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:bold;
}

/* CORES */
.status-recebido{background:#fef9c3}
.status-confirmado{background:#dbeafe}
.status-em-separacao{background:#ffedd5}
.status-separado{background:#dcfce7}
.status-saiu-para-entrega{background:#e0f2fe}
.status-entregue{background:#bbf7d0}
.status-cancelado{background:#fecaca}
.status-problema-na-entrega{background:#fee2e2}
.status-reembolso-solicitado{background:#e5e7eb}

select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:6px;
  font-weight:bold;
}
.btn-excluir{
  margin-top:10px;
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#dc2626;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.btn-excluir:hover{
  background:#b91c1c;
}
</style>
</head>

<body>

<h1>📦 Painel Admin – Controle de Pedidos</h1>
<div id="lista"></div>

<script>
/* 🔥 FIREBASE */
firebase.initializeApp({
  databaseURL:"https://loteriasmj-274f9-default-rtdb.firebaseio.com/"
});
const db = firebase.database();
const lista = document.getElementById("lista");

/* 🔹 NORMALIZAR STATUS PARA CSS */
function statusClasse(status){
  return status
    .toLowerCase()
    .replaceAll(" ","-")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

/* 🔹 OPÇÕES DE STATUS */
const STATUS = [
  "Recebido",
  "Confirmado",
  "Em separação",
  "Separado",
  "Saiu para entrega",
  "Entregue",
  "Cancelado",
  "Problema na entrega",
  "Reembolso solicitado"
];

/* 🔹 LISTAR PEDIDOS */
db.ref("pedidos").on("value", snap=>{
  const dados = snap.val();
  lista.innerHTML = "";

  if(!dados){
    lista.innerHTML="<p>Nenhum pedido encontrado.</p>";
    return;
  }

  Object.entries(dados).reverse().forEach(([id,p])=>{

    if(!p.status){
      db.ref("pedidos/"+id).update({status:"Recebido"});
      p.status="Recebido";
    }

    const div = document.createElement("div");
    div.className = "pedido";

    div.innerHTML = `
      <p><b>Cliente:</b> ${p.cliente?.nome || "-"}</p>
      <p><b>Total:</b> R$ ${Number(p.total||0).toFixed(2)}</p>
      <p><b>Entrega:</b> ${p.entrega || "2 dias"}</p>

      <p>
        <b>Status atual:</b><br>
        <span class="status status-${statusClasse(p.status)}">
          ${p.status}
        </span>
      </p>

      <label><b>Alterar status:</b></label>
<select onchange="alterarStatus('${id}', this.value)">
  ${STATUS.map(s=>`
    <option value="${s}" ${s===p.status?"selected":""}>
      ${s}
    </option>
  `).join("")}
</select>

<button class="btn-excluir" onclick="excluirPedido('${id}')">
  🗑️ Excluir Pedido
</button>
    `;

    lista.appendChild(div);
  });
});

/* 🔹 ALTERAR STATUS */
function alterarStatus(id, status){
  db.ref("pedidos/"+id).update({status});
}

function excluirPedido(id){
  const ok = confirm("⚠️ Tem certeza que deseja excluir este pedido?");
  if(!ok) return;

  db.ref("pedidos/"+id).remove()
    .then(()=>{
      alert("✅ Pedido excluído com sucesso!");
    })
    .catch(err=>{
      alert("❌ Erro ao excluir pedido");
      console.error(err);
    });
}

</script>

</body>
</html>
