}

  to{

<div class="card" id="quadrados"></div>

<script>
const firebaseConfig = {

  authDomain: "rifa-782a3.firebaseapp.com",
  databaseURL: "https://rifa-782a3-default-rtdb.firebaseio.com",
  projectId: "rifa-782a3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const nomeCliente = document.getElementById("nomeCliente");
const quadradosDiv = document.getElementById("quadrados");

let slug = null;
let nomeUsuario = null;

function slugfy(nome){
  return nome.trim().toLowerCase().replace(/\s+/g,"_");
}

function renderCartao(dados){
  if(!dados) return;

  nomeCliente.textContent = dados.nome;

  quadradosDiv.innerHTML = "";
  const marcados = dados.marcados || 0;

  for(let i=1;i<=20;i++){
    const sq = document.createElement("div");
    sq.className = "sq" + (i <= marcados ? " filled" : "");
    sq.textContent = i;
    quadradosDiv.appendChild(sq);
  }

  // 🔥 ativa animação quando completar
  if(marcados >= 20){
  quadradosDiv.classList.add("completed");
} else {
  quadradosDiv.classList.remove("completed");
}
}
function carregarCartao(){
  db.ref("cartoes/" + slug).on("value", snap=>{
    renderCartao(snap.val());
  });
}

function salvarNomeLocal(nome){
  localStorage.setItem("cartao_nome", nome);
  localStorage.setItem("cartao_slug", slugfy(nome));
}

function confirmarNome(){
  const nome = document.getElementById("inputNome").value.trim();
  if(!nome) return alert("Digite seu nome");

  nomeUsuario = nome;
  slug = slugfy(nome);

  salvarNomeLocal(nome);

  // cria no firebase se não existir
  db.ref("cartoes/" + slug).once("value").then(snap=>{
    if(!snap.exists()){
      db.ref("cartoes/" + slug).set({
        nome: nome,
        marcados: 0
      });
    }
    document.getElementById("modalNome").style.display = "none";
    carregarCartao();
  });
}

// ---------- AUTO LOGIN POR LOCALSTORAGE ----------
const nomeSalvo = localStorage.getItem("cartao_nome");
const slugSalvo = localStorage.getItem("cartao_slug");

if(nomeSalvo && slugSalvo){
  nomeUsuario = nomeSalvo;
  slug = slugSalvo;
  carregarCartao();
} else {
  document.getElementById("modalNome").style.display = "flex";
}

  }
}

</script>
