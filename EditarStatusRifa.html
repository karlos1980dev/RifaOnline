<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Admin - Rifa</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#0b0f1a;color:#fff;}
.box{
  width:95%;max-width:560px;margin:20px auto;
  background:#141a2b;padding:18px;border-radius:14px;
}
h2{text-align:center;color:#00ffcc;margin-top:0;}
.item{
  background:#0a0f1e;border-left:4px solid #00ffcc;
  padding:12px;border-radius:10px;margin-bottom:12px;
}
.valor{color:#00ffcc;font-weight:bold;font-size:18px;}
.data{font-size:12px;color:#aaa;}
select,button{
  width:100%;padding:8px;margin-top:6px;
  border:none;border-radius:8px;
}
.botoes{display:flex;gap:6px;margin-top:8px;}
button{cursor:pointer;font-weight:bold;}
.apagar{background:#dc3545;color:#fff;}
.limpar{background:#6c757d;color:#fff;}
.topo{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;gap:8px;flex-wrap:wrap;
}
.topo input{
  flex:1;min-width:140px;padding:8px;border-radius:8px;border:none;
}
.resumo{
  background:#0a0f1e;border-radius:10px;padding:10px;margin-bottom:12px;
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.resumo div{font-weight:bold;}
</style>
</head>

<body>

<div class="box">
  <h2>🛠️ Painel Admin</h2>

  <div class="topo">
    <input type="date" id="dataSelecionada">
    <div style="font-weight:bold">Valor fixo: R$ 1,00</div>
  </div>

  <div class="resumo">
    <div>Total reservas: <span id="totalReservas">0</span></div>
    <div>Total do dia: R$ <span id="totalDia">0,00</span></div>
  </div>

  <div id="lista"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
// ================= FIREBASE =================
firebase.initializeApp({
  apiKey: "AIzaSyCIDFHMmzGkN3HGLn-XA8ieC_5DDBvbJ7o",
  authDomain: "rifa-782a3.firebaseapp.com",
  databaseURL: "https://rifa-782a3-default-rtdb.firebaseio.com",
  projectId: "rifa-782a3"
});

const db = firebase.database();
const lista = document.getElementById("lista");
const totalReservasEl = document.getElementById("totalReservas");
const totalDiaEl = document.getElementById("totalDia");
const dataInput = document.getElementById("dataSelecionada");

const VALOR_FIXO = 1.00;

// data padrão = hoje
const hoje = new Date().toISOString().slice(0,10);
dataInput.value = hoje;

// ================= CARREGAR =================
function carregar(data){
  db.ref("compras-dia/"+data).off();
  db.ref("compras-dia/"+data).on("value", snap=>{
    lista.innerHTML="";
    let total = 0;
    let qtd = 0;

    const dados = snap.val() || {};

    Object.keys(dados).forEach(horario=>{
      Object.keys(dados[horario]).forEach(id=>{
        const d = dados[horario][id];

        // ===== NUMEROS (SEGURANÇA TOTAL) =====
        let numerosFormatados = "";
        let quantidade = 0;

        if (Array.isArray(d.numeros)) {
          numerosFormatados = d.numeros.join("-");
          quantidade = d.numeros.length;
        } else if (typeof d.numeros === "object" && d.numeros !== null) {
          const arr = Object.values(d.numeros);
          numerosFormatados = arr.join("-");
          quantidade = arr.length;
        }

        const valorPago = quantidade * VALOR_FIXO;

        total += valorPago;
        qtd++;

        // BLINDA VALORES NO FIREBASE
        db.ref(`compras-dia/${data}/${horario}/${id}`).update({
          valorUnitario: VALOR_FIXO,
          quantidade: quantidade,
          valorPago: valorPago
        });

        lista.innerHTML += `
          <div class="item">
            <strong>${d.nome || 'Sem nome'}</strong><br>
            Horário: <b>${horario}</b><br>
            Números: ${numerosFormatados}<br>
            <span class="valor">R$ ${valorPago.toFixed(2)}</span><br>
            <span class="data">${d.dataHora || ''}</span>

            <select onchange="alterarStatus('${data}','${horario}','${id}',this.value)">
              <option value="aguardando" ${d.status=="aguardando"?"selected":""}>Aguardando</option>
              <option value="pagou" ${d.status=="pagou"?"selected":""}>Pagou</option>
              <option value="cancelou" ${d.status=="cancelou"?"selected":""}>Cancelou</option>
            </select>

            <select onchange="alterarResultado('${data}','${horario}','${id}',this.value)">
              <option value="aguardando" ${d.resultado=="aguardando"?"selected":""}>Resultado aguardando</option>
              <option value="ganhou" ${d.resultado=="ganhou"?"selected":""}>Ganhou</option>
              <option value="perdeu" ${d.resultado=="perdeu"?"selected":""}>Perdeu</option>
            </select>

            <div class="botoes">
              <button class="limpar" onclick="limpar('${data}','${horario}','${id}')">Limpar</button>
              <button class="apagar" onclick="apagar('${data}','${horario}','${id}')">Excluir</button>
            </div>
          </div>
        `;
      });
    });

    totalReservasEl.textContent = qtd;
    totalDiaEl.textContent = total.toFixed(2).replace('.',',');
  });
}

// ================= AÇÕES =================
function alterarStatus(data,h,id,v){
  db.ref(`compras-dia/${data}/${h}/${id}`).update({status:v});
}

function alterarResultado(data,h,id,v){
  db.ref(`compras-dia/${data}/${h}/${id}`).update({resultado:v});
}

function limpar(data,h,id){
  db.ref(`compras-dia/${data}/${h}/${id}`).update({
    status:"aguardando",
    resultado:"aguardando"
  });
}

function apagar(data,h,id){
  if(confirm("Excluir esta reserva?")){
    db.ref(`compras-dia/${data}/${h}/${id}`).remove();
  }
}

// ================= EVENTOS =================
dataInput.addEventListener("change", ()=>{
  carregar(dataInput.value);
});

// INIT
carregar(hoje);
</script>

</body>
</html>
