<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<title>painel Acumulativo</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f172a;
  color:#fff;
  font-family:Arial;
  padding-top:140px;
}

/* TOPO */

#topo{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#020617;
  border-bottom:2px solid #00ff88;
  padding:12px;
  z-index:999;
}

.topo-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.topo-info{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  font-size:14px;
  font-weight:bold;
}

#resTopo{
  color:#00ff88;
}

#qtd{
  color:#ffd700;
}

.topo-buttons{
  display:flex;
  gap:10px;
}

.topo-buttons button{
  background:#00ff88;
  color:#000;
  border:none;
  border-radius:10px;
  padding:10px 14px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.topo-buttons button:hover{
  transform:scale(1.05);
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  padding:10px;
  max-width:600px;
  margin:auto;
}

@media(min-width:600px){
  .grid{
    grid-template-columns:repeat(8,1fr);
  }
}

.numero{
  padding:12px 5px;
  border:none;
  border-radius:12px;
  font-size:13px;
  font-weight:bold;
  transition:.2s;
}

.numero:hover{
  transform:scale(1.05);
}

.livre{
  background:#1e293b;
  color:#fff;
}

.ocupado{
  background:#ef4444;
  color:#fff;
}

.meu{
  background:#00ff88;
  color:#000;
}

.brinde{
  background:gold;
  color:#000;
  border:2px solid #fff;
}

/* MENU */

#menu{
  position:fixed;
  top:0;
  left:-100%;
  width:85%;
  max-width:350px;
  height:100%;
  background:#020617;
  z-index:1000;
  transition:.3s;
  overflow:auto;
  padding:20px;
}

#menu.ativo{
  left:0;
}

.menu-topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.fechar{
  background:red;
  color:#fff;
  border:none;
  padding:8px 12px;
  border-radius:8px;
}

.card{
  background:#111827;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}

.card-nome{
  color:#00ff88;
  font-weight:bold;
  margin-bottom:5px;
}

/* ADMIN */

#admin{
  position:fixed;
  bottom:-100%;
  left:0;
  width:100%;
  background:#020617;
  border-top:2px solid #00ff88;
  transition:.3s;
  z-index:1000;
  max-height:85vh;
  overflow:auto;
  padding:20px;
  border-radius:20px 20px 0 0;
}

#admin.ativo{
  bottom:0;
}

.admin-topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.inputs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.inputs input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#111827;
  color:#fff;
}

.btn-add{
  width:100%;
  background:#00ff88;
  color:#000;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  margin-bottom:20px;
}

/* LISTA ADMIN */

.item{
  background:#111827;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.item-info{
  display:flex;
  flex-direction:column;
  text-align:left;
}

.item-num{
  color:#00ff88;
  font-weight:bold;
}

.excluir{
  background:red;
  color:#fff;
  border:none;
  padding:8px 12px;
  border-radius:8px;
}

/* TODOS JOGADORES */

#todosJogadores{
  max-width:700px;
  margin:20px auto;
  padding:10px;
}

.titulo-jogadores{
  text-align:center;
  color:#00ff88;
  margin-bottom:20px;
}

.jogador-card{
  background:#111827;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.jogador-nome{
  color:#00ff88;
  font-weight:bold;
  margin-bottom:8px;
}

.jogador-numeros{
  word-break:break-word;
}

/* SCROLL */

::-webkit-scrollbar{
  width:6px;
}

::-webkit-scrollbar-thumb{
  background:#00ff88;
  border-radius:10px;
}

</style>
</head>
<body>

<!-- TOPO -->

<div id="topo">

  <div class="topo-box">

    <div class="topo-buttons">
      <button onclick="toggleMenu()">☰ MENU</button>
      <button onclick="toggleAdmin()">⚙ ADMIN</button>
    </div>

    <div class="topo-info">
      <p id="resTopo">Acumulado: R$ 100.00</p>
      <p id="qtd">Marcados: 0</p>
    </div>

  </div>

</div>

<!-- GRID -->

<div class="grid" id="grid"></div>

<!-- TODOS JOGADORES -->

<div id="todosJogadores">

  <h2 class="titulo-jogadores">
    Todos que jogaram
  </h2>

  <div id="listaJogadores"></div>

</div>

<!-- MENU -->

<div id="menu">

  <div class="menu-topo">
    <h2>Reservas</h2>
    <button class="fechar" onclick="toggleMenu()">X</button>
  </div>

  <div id="listaMenu"></div>

</div>

<!-- ADMIN -->

<div id="admin">

  <div class="admin-topo">
    <h2>Painel Admin</h2>
    <button class="fechar" onclick="toggleAdmin()">
      Fechar
    </button>
  </div>

  <div class="inputs">
    <input id="nomeAdmin" placeholder="Nome">
    <input id="numeroAdmin" placeholder="Número">
  </div>

  <button class="btn-add" onclick="adicionar()">
    Adicionar Número
  </button>

  <div id="listaAdmin"></div>

</div>

<script>

// FIREBASE

const firebaseConfig = {

apiKey: "AIzaSyCnqXmiLEMzH-GUN3nEkkdOTv_xrbxUj2A",
authDomain: "tudoaqui-b1d09.firebaseapp.com",
databaseURL: "https://tudoaqui-b1d09-default-rtdb.firebaseio.com",
projectId: "tudoaqui-b1d09",
storageBucket: "tudoaqui-b1d09.firebasestorage.app",
messagingSenderId: "588034588401",
appId: "1:588034588401:web:4731b181a31c4a354fb350"

};
// 🔥 INICIAR FIREBASE
firebase.initializeApp(firebaseConfig);

const db = firebase.database();
// USUÁRIO

let selecionados = [];

let nome =
localStorage.getItem("nome") ||
prompt("Digite seu nome:");

localStorage.setItem("nome", nome);

// REALTIME

db.ref("rifa/numeros").on("value", snap=>{

  const dados = snap.val() || {};

  render(dados);

  atualizarMenu(dados);

  atualizarAdmin(dados);

  atualizarJogadores(dados);

  // acumulado inicia em 100

  let acumulado = 00;

  Object.keys(dados).forEach(num=>{

    if(!dados[num].bonus){
      acumulado += 4.5;
    }

  });

  document.getElementById("resTopo").innerText =
  "Acumulado: R$ "+acumulado.toFixed(2);

  document.getElementById("qtd").innerText =
  "Marcados: "+selecionados.length;

});

// GRID

function render(dados){

  const grid = document.getElementById("grid");

  grid.innerHTML="";

  for(let i=0;i<100;i++){

    const num = i.toString().padStart(2,"0");

    const btn = document.createElement("button");

    btn.innerText = num;

    btn.classList.add("numero");

    if(dados[num]){

      if(dados[num].bonus){

        btn.classList.add("brinde");

      }else{

        btn.classList.add(
          dados[num].nome===nome
          ? "meu"
          : "ocupado"
        );

      }

      btn.disabled = true;

    }else{

      btn.classList.add(
        selecionados.includes(num)
        ? "meu"
        : "livre"
      );

      btn.onclick=()=>{

        if(selecionados.includes(num)){

          selecionados =
          selecionados.filter(n=>n!==num);

        }else{

          selecionados.push(num);

        }

        document.getElementById("qtd").innerText =
        "Marcados: "+selecionados.length;

        render(dados);

      }

    }

    grid.appendChild(btn);

  }

}

// MENU

function atualizarMenu(dados){

  let grupo = {};

  Object.keys(dados).forEach(num=>{

    const pessoa = dados[num].nome;

    if(!grupo[pessoa]){
      grupo[pessoa]=[];
    }

    grupo[pessoa].push(num);

  });

  const lista =
  document.getElementById("listaMenu");

  lista.innerHTML="";

  Object.keys(grupo).forEach(pessoa=>{

    let numeros = grupo[pessoa].map(n=>{

      if(dados[n].bonus){
        return "🎁 "+n;
      }

      return n;

    });

    lista.innerHTML += `
      <div class="card">
        <div class="card-nome">
          ${pessoa}
        </div>

        <div>
          ${numeros.join(", ")}
        </div>
      </div>
    `;

  });

}

// TODOS JOGADORES

function atualizarJogadores(dados){

  const lista =
  document.getElementById("listaJogadores");

  lista.innerHTML = "";

  let grupo = {};

  Object.keys(dados).forEach(num=>{

    const pessoa = dados[num].nome;

    if(!grupo[pessoa]){
      grupo[pessoa] = [];
    }

    grupo[pessoa].push(
      dados[num].bonus
      ? "🎁 "+num
      : num
    );

  });

  Object.keys(grupo).forEach(nome=>{

    lista.innerHTML += `

      <div class="jogador-card">

        <div class="jogador-nome">
          ${nome}
        </div>

        <div class="jogador-numeros">
          ${grupo[nome].join(", ")}
        </div>

      </div>

    `;

  });

}

// ADMIN

function atualizarAdmin(dados){

  const lista =
  document.getElementById("listaAdmin");

  lista.innerHTML="";

  Object.keys(dados).forEach(num=>{

    lista.innerHTML += `

      <div class="item">

        <div class="item-info">

          <span class="item-num">
            ${num}
          </span>

          <span>
            ${dados[num].nome}
          </span>

        </div>

        <button
        class="excluir"
        onclick="excluir('${num}')">
          X
        </button>

      </div>

    `;

  });

}

// ADICIONAR

function adicionar(){

  let nomeA =
  document.getElementById("nomeAdmin").value;

  let num =
  document.getElementById("numeroAdmin").value;

  if(!nomeA || num===""){

    alert("Preencha!");

    return;

  }

  num = num.padStart(3,"0");

  db.ref("rifa/numeros/"+num).set({
    nome:nomeA
  });

  document.getElementById("nomeAdmin").value="";
  document.getElementById("numeroAdmin").value="";

}

// EXCLUIR

function excluir(num){

  if(confirm("Excluir "+num+" ?")){

    db.ref("rifa/numeros/"+num).remove();

  }

}

// MENU

function toggleMenu(){

  document
  .getElementById("menu")
  .classList.toggle("ativo");

}

// ADMIN

function toggleAdmin(){

  document
  .getElementById("admin")
  .classList.toggle("ativo");

}

</script>

</body>
</html>
