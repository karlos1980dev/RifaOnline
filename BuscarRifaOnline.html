<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Buscador por Código</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    body{
      background:#111;
      color:#fff;
      font-family: Arial, sans-serif;
      padding:20px;
    }

    #buscador{
      display:flex;
      gap:10px;
      margin-bottom:10px;
    }

    #codigoBusca{
      padding:10px;
      width:200px;
      border:none;
      border-radius:8px;
      background:#222;
      color:#fff;
      text-align:center;
      outline:none;
      font-size:16px;
    }

    button{
      padding:10px 15px;
      background:#3498db;
      border:none;
      border-radius:8px;
      color:white;
      cursor:pointer;
      font-size:15px;
    }

    #resultadoBusca{
      background:#000;
      padding:15px;
      border-radius:10px;
      display:none;
      margin-top:20px;
      border:1px solid #333;
    }

    .share-btn {
      background:#27ae60;
      margin-top:10px;
      width:100%;
    }

    .zap-btn {
      background:#25D366;
      margin-top:10px;
      width:100%;
    }
  </style>

</head>
<body>

<h2>🔍 Buscar Reserva pelo Código</h2>

<div id="buscador">
  <input id="codigoBusca" type="text" placeholder="Ex: RIFA-AB123">
  <button onclick="buscarPorCodigo()">Buscar</button>
</div>

<div id="resultadoBusca"></div>


<script>
  // ------------------ FIREBASE ------------------
  const firebaseConfig = {
    apiKey: "AIzaSyCIDFHMmzGkN3HGLn-XA8ieC_5DDBvbJ7o",
    authDomain: "rifa-782a3.firebaseapp.com",
    databaseURL: "https://rifa-782a3-default-rtdb.firebaseio.com",
    projectId: "rifa-782a3",
    storageBucket: "rifa-782a3.firebasestorage.app",
    messagingSenderId: "88068598855",
    appId: "1:88068598855:web:a230a06db76a4bbc125562"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ---------- BUSCAR PELO CÓDIGO ----------
  function buscarPorCodigo(codigoManual = null) {
    const codigoDigitado = codigoManual 
         ? codigoManual.toUpperCase()
         : document.getElementById("codigoBusca").value.trim().toUpperCase();

    const box = document.getElementById("resultadoBusca");

    if (!codigoDigitado) {
      alert("Digite um código!");
      return;
    }

    box.style.display = "block";
    box.innerHTML = "<strong>🔎 Buscando...</strong>";

    const dataHoje = new Date().toISOString().slice(0, 10);

    db.ref(`compras-dia/${dataHoje}`).once("value").then(snapshot => {
      const horarios = snapshot.val() || {};
      let encontrado = null;

      for (let h in horarios) {
        for (let id in horarios[h]) {
          const item = horarios[h][id];

          if (item.codigo && item.codigo.toUpperCase() === codigoDigitado) {
            encontrado = { ...item, horario: h };
            break;
          }
        }
        if (encontrado) break;
      }

      if (!encontrado) {
        box.innerHTML = `<span style="color:red;">❌ Nenhuma reserva encontrada com o código <b>${codigoDigitado}</b></span>`;
        return;
      }

      const qtd = encontrado.numeros.length;
      const totalReceber = qtd > 0 ? (700 / qtd) : 0;
      const totalPagar = encontrado.valorUnitario * qtd;

      // GERAR LINK DIRETO
      const link = `${window.location.origin}${window.location.pathname}?codigo=${encontrado.codigo}`;

      box.innerHTML = `
        <h3>🔍 Resultado da Busca</h3>

        <strong>Nome:</strong> ${encontrado.nome}<br>
        <strong>Horário:</strong> ${encontrado.horario}<br>
        <strong>Data/Hora:</strong> ${encontrado.dataHora}<br>
        <strong>Números:</strong> ${encontrado.numeros.join(", ")}<br><br>

        <strong>Total pago:</strong> R$ ${totalPagar.toFixed(2).replace(".", ",")}<br>
        <strong>Você concorre a:</strong> R$ ${totalReceber.toFixed(2).replace(".", ",")}<br><br>

        <strong>Código da Reserva:</strong> ${encontrado.codigo}<br><br>

        <button class="share-btn" onclick="compartilharLinkSimples('${link}')">📤 Copiar Link</button>
        <button class="zap-btn" onclick="whatsappLink('${link}')">📲 Enviar no WhatsApp</button>
      `;
    });
  }

  // ---------- COMPARTILHAR APENAS O LINK ----------
  function compartilharLinkSimples(link) {
    navigator.clipboard.writeText(link);
    alert("🔗 Link copiado:\n\n" + link);
  }

  // ---------- ENVIAR PELO WHATSAPP (APENAS LINK) ----------
  function whatsappLink(link) {
    const url = "https://wa.me/?text=" + encodeURIComponent(link);
    window.open(url, "_blank");
  }

  // ---------- BUSCAR AUTOMÁTICO SE TIVER ?codigo= ----------
  const params = new URLSearchParams(window.location.search);
  if (params.has("codigo")) {
    const codigo = params.get("codigo");
    document.getElementById("codigoBusca").value = codigo;
    buscarPorCodigo(codigo);
  }
</script>

</body>
</html>
