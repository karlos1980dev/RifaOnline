<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raspadinha — Nome + Milhar Aleatória</title>

<style>
  body{
    background:#55ff97;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    font-family:Arial, sans-serif;
  }

  .card{
    position:relative;
    width:300px;
    height:190px;
    background:#fff;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
  }

  .revelado{
    z-index:1;
    font-weight:bold;
  }

  #nomeJogador{
    font-size:24px;
    color:#1aa31c;  /* nome verde */
  }

  #milharValor{
    font-size:26px;
    margin-top:6px;
    color:#e6c014; /* milhar amarelo */
  }

  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border-radius:20px;
    z-index:2;
  }
</style>
</head>

<body>

<div class="card">

  <!-- CONTEÚDO QUE FICA ESCONDIDO -->
  <div class="revelado">
    🎉 Parabéns<br>
    <span id="nomeJogador">SEU MILHAR DA SORTE</span><br>
    Milhar<br>
    <span id="milharValor"></span>
  </div>

  <!-- CAMADA DE RASPAGEM -->
  <canvas id="raspa"></canvas>

</div>


<script>
const canvas = document.getElementById("raspa");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

/* ---- GERAR MILHAR ALEATÓRIA ---- */
function gerarMilhar(){
  const numero = String(Math.floor(Math.random() * 10000)).padStart(4, "0");
  document.getElementById("milharValor").textContent = numero;
}
gerarMilhar();

/* ---- GARANTIR TAMANHO DO CANVAS ---- */
function ajustarTamanho(){
  const r = canvas.getBoundingClientRect();
  canvas.width  = r.width;
  canvas.height = r.height;
}
ajustarTamanho();
window.addEventListener("resize", ajustarTamanho);

/* ---- CRIAR CAMADA CINZA POR CIMA ---- */
function criarCamada(){
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#b9b9b9";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#dcdcdc";
  ctx.fillRect(0,0,canvas.width,45);

  ctx.font = "bold 18px Arial";
  ctx.fillStyle = "#444";
  ctx.fillText("Raspe para revelar seu milhar", 75, 28);
}
criarCamada();

let raspando = false;

function raspar(x,y){
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();
  ctx.arc(x, y, 18, 0, Math.PI * 2);
  ctx.fill();
}

/* ---- MOUSE ---- */
canvas.addEventListener("mousedown", ()=> raspando = true);
canvas.addEventListener("mouseup", ()=> raspando = false);
canvas.addEventListener("mouseleave", ()=> raspando = false);

canvas.addEventListener("mousemove", e=>{
  if(!raspando) return;
  const r = canvas.getBoundingClientRect();
  raspar(e.clientX - r.left, e.clientY - r.top);
});

/* ---- TOUCH (CELULAR) ---- */
canvas.addEventListener("touchstart", e=>{
  raspando = true;
  const r = canvas.getBoundingClientRect();
  const t = e.touches[0];
  raspar(t.clientX - r.left, t.clientY - r.top);
});

canvas.addEventListener("touchend", ()=> raspando = false);

canvas.addEventListener("touchmove", e=>{
  if(!raspando) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const t = e.touches[0];
  raspar(t.clientX - r.left, t.clientY - r.top);
},{ passive:false });
</script>

</body>
</html>
