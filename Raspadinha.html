<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raspadinha — Nome + Milhar Aleatória</title>

<style>
  body{
    background:#55ff97;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    font-family:Arial, sans-serif;
    gap:14px;
  }

  h1{
    margin:0;
    text-align:center;
    color:#2d6e30;
  }

  .card{
    position:relative;
    width:300px;
    height:190px;
    background:#fff;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
  }

  .revelado{
    z-index:1;
    font-weight:bold;
  }

  #nomeJogador{
    font-size:24px;
    color:#1aa31c;
  }

  #milharValor{
    font-size:26px;
    margin-top:6px;
    color:#e6c014;
    opacity:0;
    transform:scale(.6);
  }

  /* Animação ao revelar */
  .animarMilhar{
    opacity:1 !important;
    animation: boom .7s ease-out forwards;
  }

  @keyframes boom{
    0%{ transform:scale(.6); }
    60%{ transform:scale(1.35); }
    100%{ transform:scale(1); }
  }

  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border-radius:20px;
    z-index:2;
    cursor:pointer;
  }
</style>
</head>

<body>

<h1>MILHAR DA SORTE HOJE</h1>

<div class="card">

  <div class="revelado">
    🎉 Parabéns<br>
    <span id="nomeJogador">JOÃO DA SILVA</span><br>
    Milhar<br>
    <span id="milharValor">0000</span>
  </div>

  <canvas id="raspa"></canvas>

</div>

<script>
const canvas = document.getElementById("raspa");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

// Elementos do DOM
const nomeEl = document.getElementById("nomeJogador");
const milharEl = document.getElementById("milharValor");

/* ---- CONFIGURAÇÃO PERSONALIZÁVEL ---- */
const nomePersonalizado = "MILHAR DA SORTE";

/* ---- GERAR MILHAR ALEATÓRIA ---- */
function gerarMilhar(){
  const numero = String(Math.floor(Math.random() * 10000)).padStart(4, "0");
  milharEl.textContent = numero;
  console.log("Milhar gerado:", numero); // Para depuração
}

/* ---- DEFINIR NOME DO JOGADOR ---- */
function definirNomeJogador(){
  nomeEl.textContent = nomePersonalizado || "SEU MILHAR DA SORTE";
}

let jaRevelou = false;

/* ---- ANIMAR MILHAR ---- */
function animarMilhar(){
  milharEl.classList.add("animarMilhar");
  console.log("Milhar revelado!"); // Para depuração
}

/* ---- AJUSTAR TAMANHO DO CANVAS ---- */
function ajustarTamanho(){
  const r = canvas.getBoundingClientRect();
  canvas.width  = r.width;
  canvas.height = r.height;
  criarCamada();
}

/* ---- CAMADA CINZA ---- */
function criarCamada(){
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#b9b9b9";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#dcdcdc";
  ctx.fillRect(0,0,canvas.width,45);

  ctx.font = "bold 18px Arial";
  ctx.fillStyle = "#444";
  ctx.textAlign = "center";
  ctx.fillText("Raspe para revelar", canvas.width / 2, 28);
}

/* ---- VERIFICAR % RASPADO ---- */
function verificarRaspagem(){
  if(jaRevelou) return;

  const amostra = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  let apagados = 0;

  for(let i = 3; i < amostra.length; i += 400){
    if(amostra[i] < 100) apagados++;
  }

  // Aumentei o valor para acionar mais facilmente
  if(apagados > 100){
    jaRevelou = true;
    animarMilhar();
  }
}

/* ---- RASPAGEM ---- */
let raspando = false;

function raspar(x,y){
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();
  ctx.arc(x, y, 18, 0, Math.PI * 2);
  ctx.fill();

  verificarRaspagem();
}

/* ---- EVENTOS ---- */
// Mouse
canvas.addEventListener("mousedown", ()=> raspando = true);
canvas.addEventListener("mouseup", ()=> raspando = false);
canvas.addEventListener("mouseleave", ()=> raspando = false);
canvas.addEventListener("mousemove", e=>{
  if(!raspando) return;
  const r = canvas.getBoundingClientRect();
  raspar(e.clientX - r.left, e.clientY - r.top);
});

// Touch
canvas.addEventListener("touchstart", e=>{
  raspando = true;
  const r = canvas.getBoundingClientRect();
  const t = e.touches[0];
  raspar(t.clientX - r.left, t.clientY - r.top);
});
canvas.addEventListener("touchend", ()=> raspando = false);
canvas.addEventListener("touchmove", e=>{
  if(!raspando) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const t = e.touches[0];
  raspar(t.clientX - r.left, t.clientY - r.top);
},{ passive:false });

/* ---- INICIALIZAÇÃO (ORDEM CORRETA!) ---- */
definirNomeJogador();
gerarMilhar();
ajustarTamanho();
window.addEventListener("resize", ajustarTamanho);
</script>

</body>
</html>
