<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat on</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

<link rel="shortcut icon" href="https://raw.githubusercontent.com/karlos1980dev/RifaOnline/refs/heads/main/telescsr.jpg" type="image/jpg">
<link rel="icon" href="https://raw.githubusercontent.com/karlos1980dev/RifaOnline/refs/heads/main/telescsr.jpg" type="image/jpg">
  
  <link rel="icon" href="icone.png">
  <link rel="apple-touch-icon" href="icone.png">
  <link rel="shortcut icon" href="telescsr.jpg">
<link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="telecsr">


<style>

body{
  margin:0;
  padding:0;
  font-family: Arial;
  background:#0a0e17;
  color:#fff;
}

header{
  background:#0d1320;
  padding:0px;
  text-align:center;
  border-bottom:2px solid #00f2ff;
  box-shadow:0 0 5px #00f2ff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.painel{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:10px;
}

.box{
  background:#101728;
  border:1px solid #00f2ff;
  box-shadow:0 0 10px #00f2ff;
  border-radius:10px;
  padding:10px;
}

#usuarios{
  height:250px;
  overflow:auto;
}

#chat{
  height:250px;
  overflow:auto;
}

.msg{
  background:#16203a;
  margin:8px 0;
  padding:8px;
  border-radius:8px;
  border-left:3px solid #00ff9d;
}

input{
  width:80%;
  padding:12px;
  border-radius:8px;
  border:1px solid #00f2ff;
  background:#0d1320;
  color:#fff;
}

button{
  padding:12px;
  background:#00f2ff;
  border:none;
  color:#000;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  box-shadow:0 0 10px #00f2ff;
}

.footer{
  margin-top:10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #555;
  transition: .4s;
  border-radius: 34px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: .4s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: #00f2ff;
}

input:checked + .slider:before {
  transform: translateX(26px);
}
.msg.mencao {
  background:#1a2748;
  border-left:3px solid #ffeb3b;
}
#btnMenu{
  background:#00ff9d;
  border:none;
  padding:8px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

#menuLigacoes{
  margin:10px;
}
</style>
</head>

<body>
    

<div id="menuLigacoes">

  <button id="btnMenu" onclick="toggleMenu()">
    ☰ Menu
  </button>

  <div id="painelLigacoes" style="
  display:none;
  position:fixed;
  top:60px;
  left:10px;
  width:300px;
  background:#111;
  color:white;
  padding:10px;
  border-radius:10px;
  max-height:350px;
  overflow:auto;
  z-index:9999;
  box-shadow:0 0 15px rgba(0,0,0,0.8);
">

    <h3>Configurações</h3>

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
      <label class="switch">
        <input type="checkbox" id="switchSom" onchange="toggleSom()">
        <span class="slider"></span>
      </label>

      <span id="statusSom">Som desligado</span>
    </div>

    <hr style="border:1px solid #333;margin:10px 0;">

    <h3>Histórico de Ligações</h3>

    <div id="listaLigacoes"></div>

  </div>

</div>
<header>
  <h2>🚀 CHAT NEW</h2>
</header>
  <div id="topoConversa">

  <button style="display:none;" onclick="voltar()">Voltar</button>

  <span id="nomeTopo"></span>

  <button style="display:none;"id="btnLigarTopo" onclick="ligarAtual()">📞 Ligar</button>
</div>

<div id="telaChamada" style="display:none; position:fixed; top:10%; left:0%; background:#101728; padding:20px; border:2px solid #00f2ff; z-index:999;">

  <h3 id="infoChamada">Chamada</h3>

  <div style="display:flex; gap:10px; margin:10px;">
    <video id="videoLocal" autoplay muted style="width:150px; border:2px solid #00ff9d;"></video>
    <video id="videoRemoto" autoplay style="width:150px; border:2px solid #00f2ff;"></video>
  </div>

  <div style="text-align:center;">
    <button onclick="encerrarChamada()">Encerrar</button>
  </div>

</div>
<div id="alerta" style="display:none; background:#ff9800; padding:10px; color:#fff; margin-bottom:10px;">
  Novas mensagens: <span id="totalNovas">0</span>
</div>


<div class="container">

<!--  -->  <div class="painel">

    <div class="box">
      <h3>👥 Usuários</h3>
      <div id="usuarios"></div>
    </div>

    <div class="box">
      <h3>💬 Mensagens</h3>
      <div id="chat"></div>
    </div>

  </div>

  <div class="footer">
  <input style="font-weight:bold;" id="mensagem" placeholder="@Digite sua mensagem...">
  <input style="display:none;"type="file" id="imagem" accept="image/*">
  <button onclick="enviar()">Enviar</button>
</div>

</div>
<footer style="text-align:center; margin:0px;">
    <p>todos os direitos reservado : CSR Newtech</p>
</footer>
<script>
const firebaseConfig = {
  databaseURL: "https://loteriasmj-274f9-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const storage = firebase.storage();

let mensagensNovas = 0;
let somLiberado = false;

// ===== FUNÇÕES AUXILIARES =====

function detectarMencao(texto){
  if(!texto) return null;

  let palavras = texto.split(" ");

  for(let p of palavras){
    if(p.startsWith("@")){
      let usuario = p.replace("@", "");
      usuario = usuario.replace(/[^a-zA-Z0-9]/g, "");
      return usuario.toLowerCase();
    }
  }

  return null;
}

function gerarCor(nome){
  let hash = 0;

  for (let i = 0; i < nome.length; i++) {
    hash = nome.charCodeAt(i) + ((hash << 5) - hash);
  }

  let cor = '#';

  for (let i = 0; i < 3; i++) {
    let value = (hash >> (i * 8)) & 0xFF;
    cor += ('00' + value.toString(16)).substr(-2);
  }

  return cor;
}

function destacarMencoes(texto){
  if(!texto) return "";

  return texto.replace(/@([a-zA-Z0-9]+)/g, function(match){
    return `<span style="color:#ffeb3b; font-weight:bold;">${match}</span>`;
  });
}

function toggleSom(){

  let check = document.getElementById("switchSom").checked;

  if(check){
    liberarSom();
    localStorage.setItem("somAtivo", "sim");
  } else {
    somLiberado = false;
    document.getElementById("statusSom").innerText = "Som desligado";
    localStorage.setItem("somAtivo", "nao");
  }

}

function liberarSom(){

  let audio = new Audio("https://www.myinstants.com/media/sounds/notification.mp3");

  audio.play().then(() => {
    somLiberado = true;
    document.getElementById("statusSom").innerText = "Som ativado";
  }).catch(() => {
    alert("Clique novamente para liberar o som.");
    document.getElementById("switchSom").checked = false;
  });

}

// ===== IDENTIFICAÇÃO DO USUÁRIO =====

let nome = localStorage.getItem("nomeChat");

if(!nome){
  nome = prompt("Digite seu nome:");

  if(!nome){
    nome = "User" + Math.floor(Math.random() * 1000);
  }

  localStorage.setItem("nomeChat", nome);
}

let userId = localStorage.getItem("userIdChat");

if(!userId){

  db.ref("usuarios").once("value", function(snapshot){

    let encontrado = false;

    snapshot.forEach(function(child){
      let u = child.val();

      if(u.nome == nome){
        userId = child.key;
        encontrado = true;
      }
    });

    if(!encontrado){
      userId = Math.floor(Math.random() * 1000000);
    }

    localStorage.setItem("userIdChat", userId);
    iniciarUsuario();
  });

} else {
  iniciarUsuario();
}

// ===== INICIAR USUÁRIO =====

function iniciarUsuario(){

  db.ref("usuarios/" + userId).once("value", function(snap){

    if(snap.exists()){
      db.ref("usuarios/" + userId).update({
        status: "online"
      });
    } else {
      db.ref("usuarios/" + userId).set({
        nome: nome,
        status: "online",
        total: 0,
        foto: "https://cdn-icons-png.flaticon.com/512/149/149071.png"
      });
    }

  });

  db.ref("usuarios/" + userId).onDisconnect().update({
    status: "offline"
  });

}

// ===== ENVIAR MENSAGEM =====

function enviar(){

  let texto = document.getElementById("mensagem").value;
  let arquivo = document.getElementById("imagem").files[0];

  if(texto == "" && !arquivo) return;

  if(arquivo){

    let nomeArquivo = Date.now() + "_" + arquivo.name;

    let ref = storage.ref("imagens/" + nomeArquivo);

    ref.put(arquivo).then(() => {

      ref.getDownloadURL().then(url => {

        db.ref("mensagens").push({
          nome: nome,
          texto: texto,
          imagem: url,
          data: new Date().toLocaleTimeString(),
          userId: userId
        });

      });

    });

  } else {

    db.ref("mensagens").push({
      nome: nome,
      texto: texto,
      data: new Date().toLocaleTimeString(),
      userId: userId
    });

  }

  document.getElementById("mensagem").value = "";
  document.getElementById("imagem").value = "";
}

// ===== RECEBER MENSAGENS =====

db.ref("mensagens").on("value", function(snapshot){

  let chat = document.getElementById("chat");
  chat.innerHTML = "";

  snapshot.forEach(function(child){

    let id = child.key;
    let msg = child.val();

    let corUsuario = gerarCor(msg.nome);

    let fotoUsuario = "https://cdn-icons-png.flaticon.com/512/149/149071.png";

    if(msg.userId){
      db.ref("usuarios/" + msg.userId + "/foto").once("value", snap => {
        if(snap.exists()){
          fotoUsuario = snap.val();
        }
      });
    }

    let conteudoImagem = "";

    if(msg.imagem){
      conteudoImagem = `
        <br>
        <img src="${msg.imagem}" style="max-width:200px;border-radius:10px;margin-top:5px;">
      `;
    }

    let botoes = "";

    if(msg.userId == userId){

      botoes = `
        <span style="float:right;cursor:pointer;margin-left:10px;"
          onclick="excluirMensagem('${id}', '${msg.userId}')">❌</span>

        <span style="float:right;cursor:pointer;"
          onclick="editarMensagem('${id}', '${msg.userId}', '${msg.texto || ""}')">✏️</span>
      `;
    }

    let classe = "msg";

    let mencionado = detectarMencao(msg.texto);

    if(mencionado && mencionado === nome.toLowerCase()){
      classe = "msg mencao";
    }

    let textoFormatado = destacarMencoes(msg.texto);

    chat.innerHTML += `
      <div class="${classe}">

        <div style="display:flex; align-items:center; gap:8px;">

          <img src="${fotoUsuario}" 
               style="width:35px; height:35px; border-radius:50%; border:2px solid ${corUsuario};">

          <b style="color:${corUsuario}">${msg.nome}</b>

          ${botoes}

        </div>

        <div style="margin-left:45px; margin-top:5px;">
          ${textoFormatado || ""}
          ${conteudoImagem}
          <br>
          <small>${msg.data}</small>
        </div>

      </div>
    `;

  });

  chat.scrollTop = chat.scrollHeight;

});

// ===== EXCLUIR E EDITAR =====

function excluirMensagem(id, dono){

  if(dono !== userId){
    alert("Você só pode excluir suas próprias mensagens!");
    return;
  }

  if(confirm("Deseja excluir esta mensagem?")){
    db.ref("mensagens/" + id).remove();
  }

}

function editarMensagem(id, dono, textoAtual){

  if(dono !== userId){
    alert("Você só pode editar suas próprias mensagens!");
    return;
  }

  let novoTexto = prompt("Editar mensagem:", textoAtual);

  if(novoTexto){
    db.ref("mensagens/" + id).update({
      texto: novoTexto + " (editado)"
    });
  }

}

// ===== LISTA DE USUÁRIOS =====

db.ref("usuarios").on("value", function(snapshot){

  let lista = document.getElementById("usuarios");
  lista.innerHTML = "";

  snapshot.forEach(function(child){

    let u = child.val();

    if(u.status == "online"){

      lista.innerHTML += `
        <div style="color:#00ff9d; margin-bottom:8px;">

          <span>● ${u.nome} - online</span>

          ${u.nome !== nome ? `

          <div style="display:flex; gap:8px; margin-top:5px;">

            <button onclick="ligarPara('${child.key}','${u.nome}', false)">
              📞 Áudio
            </button>

            <button onclick="ligarPara('${child.key}','${u.nome}', true)">
              🎥 Vídeo
            </button>

          </div>

          ` : ""}

        </div>
      `;
    }

  });

});
// ===== CARREGAR CONFIGURAÇÕES =====

window.onload = function(){

  let salvo = localStorage.getItem("somAtivo");

  if(salvo === "sim"){
    document.getElementById("switchSom").checked = true;
    somLiberado = true;
    document.getElementById("statusSom").innerText = "Som ativado";
  }

}
let usuarioLigando = null;
let peerConnection;
let localStream;

const configRTC = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

async function ligarPara(destinoId, destinoNome, comVideo){

  usuarioLigando = destinoId;

  document.getElementById("telaChamada").style.display = "block";

  document.getElementById("infoChamada").innerText =
    "Ligando para " + destinoNome + (comVideo ? " (Vídeo)" : " (Áudio)");

  registrarLigacao(destinoNome, comVideo);

  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: comVideo
    });
  }catch(e){
    alert("Permissão de câmera/microfone negada!");
    return;
  }

  document.getElementById("videoLocal").srcObject = localStream;

  peerConnection = new RTCPeerConnection(configRTC);

  localStream.getTracks().forEach(track => {
    peerConnection.addTrack(track, localStream);
  });

  peerConnection.onicecandidate = event => {
    if(event.candidate){
      db.ref("chamadas/" + destinoId).update({
        tipo: "candidate",
        candidate: event.candidate
      });
    }
  };

  peerConnection.ontrack = event => {
    document.getElementById("videoRemoto").srcObject = event.streams[0];
  };

  let offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);

  db.ref("chamadas/" + destinoId).set({
    tipo: "offer",
    oferta: offer,
    de: userId,
    nome: nome,
    video: comVideo
  });

  registrarHistorico("saindo", destinoNome);
}
db.ref("chamadas/" + userId).on("value", async snap => {

  let dados = snap.val();
  if(!dados) return;

  if(dados.tipo === "offer"){

    usuarioLigando = dados.de;

    let somChamada = tocarSomChamada();

    document.getElementById("telaChamada").style.display = "block";

    document.getElementById("infoChamada").innerHTML = `
      📞 ${dados.nome} está ligando (${dados.video ? "Vídeo" : "Áudio"})...<br><br>
      <button onclick="aceitarChamada(); pararSom(somChamada)">Aceitar</button>
      <button onclick="recusarChamada(); pararSom(somChamada)">Recusar</button>
    `;

    window.offerRecebida = dados;

    registrarHistorico("entrada", dados.nome);

  }

  if(dados.tipo === "answer"){
    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(dados.resposta)
    );
  }

  if(dados.tipo === "candidate"){
    await peerConnection.addIceCandidate(dados.candidate);
  }

});

async function aceitarChamada(){

  let dados = window.offerRecebida;

  document.getElementById("infoChamada").innerText =
    "Em chamada com " + dados.nome;

  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: true
    });
  }catch(e){
    alert("Permissão negada!");
    return;
  }

  document.getElementById("videoLocal").srcObject = localStream;

  peerConnection = new RTCPeerConnection(configRTC);

  localStream.getTracks().forEach(track => {
    peerConnection.addTrack(track, localStream);
  });

  peerConnection.onicecandidate = event => {
    if(event.candidate){
      db.ref("chamadas/" + dados.de).update({
        tipo: "candidate",
        candidate: event.candidate
      });
    }
  };

  peerConnection.ontrack = event => {
    document.getElementById("videoRemoto").srcObject = event.streams[0];
  };

  await peerConnection.setRemoteDescription(
    new RTCSessionDescription(dados.oferta)
  );

  let answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);

  db.ref("chamadas/" + dados.de).update({
    tipo: "answer",
    resposta: answer
  });

}

function recusarChamada(){
  db.ref("chamadas/" + userId).remove();
  document.getElementById("telaChamada").style.display = "none";
}

function encerrarChamada(){

  if(peerConnection){
    peerConnection.close();
  }

  if(localStream){
    localStream.getTracks().forEach(t => t.stop());
  }

  if(usuarioLigando){
    db.ref("chamadas/" + usuarioLigando).remove();
  }

  db.ref("chamadas/" + userId).remove();

  document.getElementById("telaChamada").style.display = "none";

  document.getElementById("videoLocal").srcObject = null;
  document.getElementById("videoRemoto").srcObject = null;

  document.getElementById("infoChamada").innerText = "Ligação encerrada";
}
function tocarSomChamada(){
  let audio = new Audio("https://www.myinstants.com/media/sounds/skype-incoming-call.mp3");
  audio.loop = true;
  audio.play();
  return audio;
}
function pararSom(audio){
  if(audio){
    audio.pause();
    audio.currentTime = 0;
  }
}
function registrarHistorico(tipo, comQuem){

  db.ref("historicoChamadas").push({
    de: nome,
    para: comQuem,
    tipo: tipo,
    data: new Date().toLocaleString()
  });

}
db.ref("historicoChamadas").limitToLast(20).on("value", function(snapshot){

  let div = document.getElementById("listaLigacoes");

  if(!div) return;

  div.innerHTML = "";

  snapshot.forEach(function(child){

    let h = child.val();

    div.innerHTML += `
      <p>
        ${h.de} → ${h.para}  
        (${h.tipo})  
        <br>
        <small>${h.data}</small>
      </p>
      <hr>
    `;

  });

});
function toggleMenu(){

  let painel = document.getElementById("painelLigacoes");

  if(painel.style.display === "none"){
    painel.style.display = "block";
  } else {
    painel.style.display = "none";
  }

}
function registrarLigacao(destinoNome, tipo){

  let lista = document.getElementById("listaLigacoes");

  let data = new Date().toLocaleString();

  lista.innerHTML = `

    <div style="
      padding:6px;
      border-bottom:1px solid #333;
      font-size:14px;
    ">

      ${tipo ? "🎥 Vídeo" : "📞 Áudio"} com 
      <b>${destinoNome}</b>
      <br>
      <small>${data}</small>

    </div>

  ` + lista.innerHTML;

}
function voltar(){
  document.getElementById("telaChamada").style.display = "none";
}
function ligarAtual(){
  if(!usuarioLigando){
    alert("Nenhum usuário selecionado para ligar!");
    return;
  }

  ligarPara(usuarioLigando, document.getElementById("nomeTopo").innerText, true);
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
  .then(function() {
    console.log("PWA registrado com sucesso!");
  })
  .catch(function(err) {
    console.log("Erro ao registrar PWA:", err);
  });
}
</script>
</body>
</html>
