<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>painel bloquea Numero</title>
  <link rel="shortcut icon" href="https://raw.githubusercontent.com/karlos1980dev/RifaOnline/refs/heads/main/fdsabado.jpg" type="image/jpg">
<link rel="icon" href="https://raw.githubusercontent.com/karlos1980dev/RifaOnline/refs/heads/main/fdsabado.jpg" type="image/jpg">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    #grid-numeros {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      max-width: 360px;
      margin: 0 auto 20px auto;
    }
    .item-numero {
      background: #333;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 6px #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .numero-texto {
      font-size: 1.4rem;
      font-weight: bold;
    }
    .bloqueado {
      background: #c0392b;
      color: #fff;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .liberado {
      background: #27ae60;
      color: #fff;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>

  <title>Painel ADM - Bloquear/Desbloquear</title>
</head>
<body>

<h1>Painel Bloquear/Desbloquear Números</h1>
<input
  type="text"
  id="nomeBloqueio"
  placeholder="Nome para o bloqueio"
  style="width:100%;max-width:360px;padding:10px;border-radius:8px;border:none;margin-bottom:15px;"
><div style="margin-top:10px;">
  <strong>PIX atual:</strong>
  <button
  id="btnLimparPix"
  style="
    margin-top:10px;
    padding:10px;
    width:100%;
    max-width:360px;
    background:#e74c3c;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
  "
>
🧹 LIMPAR PIX
</button>
  <span id="pixAdminAtual" style="color:#2ecc71"></span>
</div></br>
<div id="grid-numeros"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCIDFHMmzGkN3HGLn-XA8ieC_5DDBvbJ7o",
  authDomain: "rifa-782a3.firebaseapp.com",
  databaseURL: "https://rifa-782a3-default-rtdb.firebaseio.com",
  projectId: "rifa-782a3",
  storageBucket: "rifa-782a3",
  messagingSenderId: "88068598855",
  appId: "1:88068598855:web:a230a06db76a4bbc125562"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const grid = document.getElementById('grid-numeros');
const nomeInput = document.getElementById("nomeBloqueio");

/* 🔄 ATUALIZA EM TEMPO REAL */
db.ref("numerosBloqueados").on("value", snapshot => {
  const bloqueios = snapshot.val() || {};
  grid.innerHTML = "";

  for (let i = 0; i < 100; i++) {
    const num = i.toString().padStart(2, "0");
    const info = bloqueios[num];
    const bloqueado = !!info;

    const item = document.createElement("div");
    item.className = "item-numero";

    const nome = info?.nome || "";
    const extra = info?.extra ? "🎁" : "";

    const btn = document.createElement("button");
    btn.className = bloqueado ? "bloqueado" : "liberado";
    btn.textContent = bloqueado ? "Desbloquear" : "Bloquear";

    btn.onclick = () => {
      if (!bloqueado) {
        const nomeBloq = nomeInput.value.trim();
        if (!nomeBloq) {
          alert("Informe o nome para bloquear");
          return;
        }

        db.ref("numerosBloqueados/" + num).update({
          nome: nomeBloq,
          bloqueadoEm: Date.now()
        });

      } else {
        db.ref("numerosBloqueados/" + num).remove();
      }
    };

    item.innerHTML = `
      <span class="numero-texto">${num} ${extra}</span>
      <span style="font-size:12px;color:#ccc">${nome}</span>
    `;
    item.appendChild(btn);
    grid.appendChild(item);
  }
});

/* PIX ADMIN */
db.ref('admin/config/pix').on('value', snap => {
  const dados = snap.val();
  if (dados?.chave) {
    document.getElementById('pixAdminAtual').textContent = dados.chave;
  }
});
document.getElementById('btnLimparPix').onclick = () => {
  const ok = confirm('⚠️ Tem certeza que deseja LIMPAR o PIX?');
  if (!ok) return;

  db.ref('admin/config/pix').remove()
    .then(() => {
      document.getElementById('pixAdminAtual').textContent = '';
      alert('✅ PIX removido com sucesso');
    })
    .catch(err => {
      alert('❌ Erro ao limpar PIX');
      console.error(err);
    });
};
</script>
</body>
</html>
