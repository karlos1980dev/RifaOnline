<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat on</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
<style>

body{
  margin:0;
  padding:0;
  font-family: Arial;
  background:#0a0e17;
  color:#fff;
}

header{
  background:#0d1320;
  padding:5px;
  text-align:center;
  border-bottom:2px solid #00f2ff;
  box-shadow:0 0 5px #00f2ff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.painel{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:10px;
}

.box{
  background:#101728;
  border:1px solid #00f2ff;
  box-shadow:0 0 10px #00f2ff;
  border-radius:10px;
  padding:10px;
}

#usuarios{
  height:100px;
  overflow:auto;
}

#chat{
  height:250px;
  overflow:auto;
}

.msg{
  background:#16203a;
  margin:8px 0;
  padding:8px;
  border-radius:8px;
  border-left:3px solid #00ff9d;
}

input{
  width:80%;
  padding:12px;
  border-radius:8px;
  border:1px solid #00f2ff;
  background:#0d1320;
  color:#fff;
}

button{
  padding:12px;
  background:#00f2ff;
  border:none;
  color:#000;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  box-shadow:0 0 10px #00f2ff;
}

.footer{
  margin-top:10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
</style>
</head>

<body>

<div id="alerta" style="display:none; background:#ff9800; padding:10px; color:#fff; margin-bottom:10px;">
  Novas mensagens: <span id="totalNovas">0</span>
</div>

<header>
  <h2>🚀 CHAT ON</h2>
</header>
<div style="text-align:center;margin:10px;">
  <button style="width:80%;" onclick="ativarSom()">🔊 Ativar Som</button>
</div>
<div class="container">

  <div class="painel">

    <div class="box">
      <h3>👥 Usuários</h3>
      <div id="usuarios"></div>
    </div>

    <div class="box">
      <h3>💬 Mensagens</h3>
      <div id="chat"></div>
    </div>

  </div>

  <div class="footer">
  <input id="mensagem" placeholder="Digite sua mensagem...">
  <input style="display:none;"type="file" id="imagem" accept="image/*">
  <button onclick="enviar()">Enviar</button>
</div>

</div>

<script>
const firebaseConfig = {
  databaseURL: "https://loteriasmj-274f9-default-rtdb.firebaseio.com/"
  
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();
let mensagensNovas = 0;
let somLiberado = false;

// ===== FUNÇÕES AUXILIARES =====

function detectarMencao(texto){

  let palavras = texto.split(" ");

  for(let p of palavras){

    if(p.startsWith("@")){

      let usuario = p.replace("@", "");

      // remove possíveis vírgulas ou pontos
      usuario = usuario.replace(/[^a-zA-Z0-9]/g, "");

      return usuario.toLowerCase();
    }
  }

  return null;
}

function gerarCor(nome){
  let hash = 0;

  for (let i = 0; i < nome.length; i++) {
    hash = nome.charCodeAt(i) + ((hash << 5) - hash);
  }

  let cor = '#';

  for (let i = 0; i < 3; i++) {
    let value = (hash >> (i * 8)) & 0xFF;
    cor += ('00' + value.toString(16)).substr(-2);
  }

  return cor;
}

function tocarSom(){
  if(!somLiberado){
    console.log("Som ainda não foi liberado pelo usuário");
    return;
  }

  let audio = new Audio("https://www.myinstants.com/media/sounds/notification.mp3");

  audio.play().catch(err => {
    console.log("Erro ao tocar som:", err);
  });
}

function ativarSom(){
  let audio = new Audio("https://www.myinstants.com/media/sounds/notification.mp3");

  audio.play().then(() => {
    somLiberado = true;
    alert("Som ativado com sucesso!");
  }).catch(() => {
    alert("Clique novamente para liberar o som.");
  });
}

// ===== IDENTIFICAÇÃO DO USUÁRIO =====

let nome = localStorage.getItem("nomeChat");

if(!nome){
  nome = prompt("Digite seu nome:");

  if(!nome){
    nome = "User" + Math.floor(Math.random() * 1000);
  }

  localStorage.setItem("nomeChat", nome);
}

let userId = localStorage.getItem("userIdChat");

if(!userId){

  db.ref("usuarios").once("value", function(snapshot){

    let encontrado = false;

    snapshot.forEach(function(child){
      let u = child.val();

      if(u.nome == nome){
        userId = child.key;
        encontrado = true;
      }
    });

    if(!encontrado){
      userId = Math.floor(Math.random() * 1000000);
    }

    localStorage.setItem("userIdChat", userId);
    iniciarUsuario();
  });

} else {
  iniciarUsuario();
}

// ===== INICIAR USUÁRIO =====

function iniciarUsuario(){

  db.ref("usuarios/" + userId).once("value", function(snap){

    if(snap.exists()){
      db.ref("usuarios/" + userId).update({
        status: "online"
      });
    } else {
      db.ref("usuarios/" + userId).set({
        nome: nome,
        status: "online",
        total: 0
      });
    }

  });

  db.ref("usuarios/" + userId).onDisconnect().update({
    status: "offline"
  });

}

// ===== ENVIAR MENSAGEM =====

function enviar(){

  let texto = document.getElementById("mensagem").value;
  let arquivo = document.getElementById("imagem").files[0];

  if(texto == "" && !arquivo) return;

  if(arquivo){

    let nomeArquivo = Date.now() + "_" + arquivo.name;

    let ref = storage.ref("imagens/" + nomeArquivo);

    ref.put(arquivo).then(() => {

      ref.getDownloadURL().then(url => {

        db.ref("mensagens").push({
          nome: nome,
          texto: texto,
          imagem: url,
          data: new Date().toLocaleTimeString(),
          userId: userId
        });

      });

    });

  } else {

    db.ref("mensagens").push({
      nome: nome,
      texto: texto,
      data: new Date().toLocaleTimeString(),
      userId: userId
    });

  }

  document.getElementById("mensagem").value = "";
  document.getElementById("imagem").value = "";

  mensagensNovas = 0;
  document.getElementById("alerta").style.display = "none";
  document.title = "Chat on";
}

// ===== RECEBER MENSAGENS =====

db.ref("mensagens").on("value", function(snapshot){

  let chat = document.getElementById("chat");
  chat.innerHTML = "";

  snapshot.forEach(function(child){

    let id = child.key;
    let msg = child.val();

    let corUsuario = gerarCor(msg.nome);

    let conteudoImagem = "";

    if(msg.imagem){
      conteudoImagem = `
        <br>
        <img src="${msg.imagem}" style="max-width:200px;border-radius:10px;margin-top:5px;">
      `;
    }

    let botoes = "";

    if(msg.userId == userId){

      botoes = `
        <span style="float:right;cursor:pointer;margin-left:10px;"
          onclick="excluirMensagem('${id}', '${msg.userId}')">❌</span>

        <span style="float:right;cursor:pointer;"
          onclick="editarMensagem('${id}', '${msg.userId}', '${msg.texto || ""}')">✏️</span>
      `;
    }

    chat.innerHTML += `
      <div class="msg">
        ${botoes}
        <b style="color:${corUsuario}">${msg.nome}</b>
        <br>
        ${msg.texto || ""}
        ${conteudoImagem}
        <br>
        <small>${msg.data}</small>
      </div>
    `;

  });

  chat.scrollTop = chat.scrollHeight;

});
// ===== ATUALIZAR USUÁRIOS EM TEMPO REAL =====

db.ref("usuarios").on("value",     function(snapshot){

  let lista = document.getElementById("usuarios");
  lista.innerHTML = "";

  snapshot.forEach(function(child){

    let u = child.val();
    let total = u.total || 0;

    if(u.status == "online"){

      lista.innerHTML += `
        <p style="color:#00ff9d">
          ● ${u.nome} - online - ${total}
        </p>
      `;
    }

  });

});

// ===== ZERAR AO CLICAR NO CHAT =====

document.getElementById("chat").addEventListener("click", function(){

  mensagensNovas = 0;

  document.getElementById("alerta").style.display = "none";

  document.title = "Chat on";

});
function excluirMensagem(id, dono){

  if(dono !== userId){
    alert("Você só pode excluir suas próprias mensagens!");
    return;
  }

  let confirmar = confirm("Deseja excluir esta mensagem?");

  if(!confirmar) return;

  db.ref("mensagens/" + id).remove();
}
function editarMensagem(id, dono, textoAtual){

  if(dono !== userId){
    alert("Você só pode editar suas próprias mensagens!");
    return;
  }

  let novoTexto = prompt("Editar mensagem:", textoAtual);

  if(novoTexto === null || novoTexto === "") return;

  db.ref("mensagens/" + id).update({
    texto: novoTexto + " (editado)"
  });
}
</script>
</body>
</html>
