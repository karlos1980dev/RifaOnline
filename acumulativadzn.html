<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
 

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<link rel="shortcut icon" href="https://raw.githubusercontent.com/karlos1980dev/RifaOnline/refs/heads/main/file_00000000c28471fba60c52601e2a4d2c.png" type="image/jpg">
<link rel="icon" href="https://raw.githubusercontent.com/karlos1980dev/RifaOnline/refs/heads/main/file_00000000c28471fba60c52601e2a4d2c.png" type="image/jpg">
<style>
    
    #resValor {
  font-size:20px;
  color:#00ff88;
  font-weight:bold;
}
body {
  background:#111;
  color:#fff;
  font-family:Arial;
  text-align:center;
  padding-top: 130px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:6px;
  max-width:400px;
  margin:30px auto;
}

button {
  
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  
  padding:8px;
  font-size:12px;

}

.livre { background:#333; color:#fff; }
.ocupado { background:#ff3b3b; color:#fff; cursor:not-allowed; }
.meu { background:#00ff88; color:#000; }
#topoFixo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background: #000;
  padding: 2px;
  z-index: 1000;
  border-bottom: 2px solid #00ff88;

  display: flex;
  align-items: center;
  justify-content: flex-start; /* 👈 ALTERADO */
  gap: 10px; /* controla distância */
  flex-wrap: wrap;
}

#topoFixo button {
  background:#00ff88;
  color:#000;
}

#resTopo {
  color: #ffaa00;
  font-weight: bold;
}

#dataSorteio {
  color: #00ff88;
  font-weight: bold;
}

#nome {
  font-size: 14px;
}
.lado-direito {
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap: wrap;
}
#qtdSelecionados {
  color: #00ff88;
  font-weight: bold;
}
#menuBtn {
  font-size: 22px;
  cursor: pointer;
  color: #00ff88;
}

#menuLateral {
  position: fixed;
  top: 0;
  left: -100%;
  width: 80%;
  height: 100%;
  background: #000;
  z-index: 2000;
  padding: 15px;
  overflow-y: auto;
  transition: 0.3s;
}

#menuLateral.ativo {
  left: 0;
}

#listaReservas {
  margin-top: 10px;
  text-align: left;
  font-size: 14px;
}

.linha-nome {
  color: #00ff88;
  margin-top: 15px;
  font-weight: bold;
}

.linha-numeros {
  color: #fff;
  margin-bottom: 10px;
}

.divisor {
  border-bottom: 1px solid #444;
  margin: 10px 0;
}
.brinde {
  background: gold !important;
  color: #000 !important;
  font-weight: bold;
  border: 2px solid #ffcc00;
}
</style>
</head>
<body>

<div id="topoFixo">
    <div id="menuBtn" onclick="toggleMenu()">☰</div></br>
  <p id="resTopo">Acumulado: R$ 0.00</p>
  <p id="dataSorteio"></p>
  <p id="nome"></p>
  <p id="qtdSelecionados">Marcados: 0</p>

  <button style="width:100%" onclick="abrirResumo()">APOSTA</button>
</div>

<div class="grid" id="grid"></div>

<div id="modal" style="
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
">
  <div style="
    background:#111;
    padding:20px;
    border-radius:12px;
    width:90%;
    max-width:350px;
    text-align:center;
  ">
    <h3>Resumo</h3>

    <p id="resNome"></p>
    <p id="resNumeros"></p>
    <p id="resValor"></p>

    <button onclick="confirmar()">Salvar</button>
    <button onclick="fecharModal()">Cancelar</button>
  </div>
</div>
<div id="menuLateral">
  <h3>Reservas</h3>
  <div id="listaReservas"></div>
</div><div id="modalPix" style="
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
">
  <div style="
    background:#111;
    padding:20px;
    border-radius:12px;
    width:90%;
    max-width:350px;
    text-align:center;
  ">
    <h3>Pagamento via Pix</h3>

    <p>Chave Pix:</p>
    <p id="chavePix" style="color:#00ff88; font-weight:bold;">
      71992290058
    </p>

    <div style="display:flex; gap:10px; justify-content:center; margin-top:15px;">
  <button style="flex:1;" onclick="copiarPix()">Copiar</button>
  <button style="flex:1; background:#ff3b3b; color:#fff;" onclick="fecharPix()">Fechar</button>
</div>
  </div>
</div>
<div id="modalPix" style="
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
">
  <div style="
    background:#111;
    padding:20px;
    border-radius:12px;
    width:90%;
    max-width:350px;
    text-align:center;
  ">
    <h3>Pagamento via Pix</h3>

    <p>Chave Pix:</p>
    <p id="chavePix" style="color:#00ff88; font-weight:bold;">
      71992290058
    </p>

    <button onclick="copiarPix()">Copiar Chave</button>
    <br><br>
    <button onclick="fecharPix()">Fechar</button>
  </div>
</div>
<script>
// 🔥 CONFIG FIREBASE
const firebaseConfig = {

apiKey: "AIzaSyCnqXmiLEMzH-GUN3nEkkdOTv_xrbxUj2A",
authDomain: "tudoaqui-b1d09.firebaseapp.com",
databaseURL: "https://tudoaqui-b1d09-default-rtdb.firebaseio.com",
projectId: "tudoaqui-b1d09",
storageBucket: "tudoaqui-b1d09.firebasestorage.app",
messagingSenderId: "588034588401",
appId: "1:588034588401:web:4731b181a31c4a354fb350"

};
// 🔥 INICIAR FIREBASE
firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// 👤 NOME
let nome = localStorage.getItem("nome");
if (!nome) {
  nome = prompt("Digite seu nome:");
  localStorage.setItem("nome", nome);
}
document.getElementById("nome").innerText = "Jogador: " + nome;

// 🧠 VARIÁVEIS
let selecionados = [];
let numerosCache = {};
let meusNumeros = [];
// 🔄 FIREBASE LISTENER (ÚNICO)
db.ref("rifa/numeros").on("value", snap => {
  const numeros = snap.val() || {};
  numerosCache = numeros;

  // pegar números do usuário
  meusNumeros = Object.keys(numeros).filter(n => numeros[n].nome === nome);

  atualizarGrid(numeros);
  atualizarAcumulado(numeros);
  atualizarContador();
  atualizarMenu(numeros);
});

function calcularBrindes(total) {
  return Math.floor(total / 4);
}

// 🎯 GRID
function atualizarGrid(numeros) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  for (let i = 0; i < 100; i++) {
    const num = i.toString().padStart(2, "0");
    const btn = document.createElement("button");
    btn.innerText = num;

    if (numeros[num]) {
      if (numeros[num].bonus) {
        btn.className = "brinde";
      } else {
        btn.className = numeros[num].nome === nome ? "meu" : "ocupado";
      }
      btn.disabled = true;

    } else {
      btn.className = selecionados.includes(num) ? "meu" : "livre";

      btn.onclick = () => {
        if (selecionados.includes(num)) {
          selecionados = selecionados.filter(n => n !== num);
        } else {
          selecionados.push(num);
        }
        atualizarContador();
        atualizarGrid(numeros);
      };
    }

    grid.appendChild(btn);
  }
}

// 💰 ACUMULADO
// 💰 ACUMULADO
function atualizarAcumulado(numeros) {

  // 👇 começa com 00
  let totalPago = 0;

  Object.keys(numeros).forEach(num => {
    const item = numeros[num];

    // ❌ IGNORA BRINDE
    if (item.bonus) return;

    // ✔ soma números pagos
    totalPago += 2.5;
  });

  document.getElementById("resTopo").innerText =
    "Acumulado: R$ " + totalPago.toFixed(2);
}
// 🔢 CONTADOR
function atualizarContador() {
  document.getElementById("qtdSelecionados").innerText =
    "Marcados: " + selecionados.length;
}

// 📋 MENU
function atualizarMenu(numeros) {
  let agrupado = {};

  Object.keys(numeros).forEach(num => {
    const pessoa = numeros[num].nome;
    if (!agrupado[pessoa]) agrupado[pessoa] = [];
    agrupado[pessoa].push(num);
  });

  const lista = document.getElementById("listaReservas");
  if (!lista) return;

  lista.innerHTML = "";

  Object.keys(agrupado).forEach(nomePessoa => {
    const divNome = document.createElement("div");
    divNome.className = "linha-nome";
    divNome.innerText = nomePessoa;

    const divNum = document.createElement("div");
    divNum.className = "linha-numeros";

    let listaNums = agrupado[nomePessoa].map(n =>
      numeros[n]?.bonus ? "🎁 " + n : n
    );

    divNum.innerHTML = listaNums.map(n => {
  if (n.includes("🎁")) {
    return `<span style="color:gold;font-weight:bold">${n}</span>`;
  }
  return n;
}).join(", ");

    const divisor = document.createElement("div");
    divisor.className = "divisor";

    lista.appendChild(divNome);
    lista.appendChild(divNum);
    lista.appendChild(divisor);
  });
}

// 🧾 ABRIR RESUMO
function abrirResumo() {
  if (selecionados.length === 0) {
    alert("Selecione pelo menos um número!");
    return;
  }

  let quantidadeNova = selecionados.length;

  let totalAntes = meusNumeros.length;
  let totalDepois = totalAntes + quantidadeNova;

  let brindesAntes = calcularBrindes(totalAntes);
  let brindesDepois = calcularBrindes(totalDepois);

  let novosBrindes = brindesDepois - brindesAntes;

  let totalPagamento = quantidadeNova * 3;

  document.getElementById("resNome").innerText =
    "Nome: " + nome;

  document.getElementById("resNumeros").innerText =
    "Dezenas: " + selecionados.join(", ") +
    (novosBrindes > 0 ? " + " + novosBrindes + " brinde(s)" : "");

  document.getElementById("resValor").innerText =
    "Total a pagar: R$ " + totalPagamento.toFixed(2);

  document.getElementById("modal").style.display = "flex";
}

// 💾 CONFIRMAR
function confirmar() {
  if (selecionados.length === 0) return;

  const valor = 3;

  let totalAntes = meusNumeros.length;
  let totalDepois = totalAntes + selecionados.length;

  let brindesAntes = calcularBrindes(totalAntes);
  let brindesDepois = calcularBrindes(totalDepois);

  let novosBrindes = brindesDepois - brindesAntes;

  let vendidos = [];

  // salvar números normais
  selecionados.forEach(num => {
    const ref = db.ref("rifa/numeros/" + num);

    ref.transaction(current => {
      if (current === null) {
        vendidos.push(num);
        return {
          nome: nome,
          valor: valor
        };
      }
    });
  });

  // 🎁 gerar brindes
  for (let i = 0; i < novosBrindes; i++) {
    let numeroBonus;

    do {
      numeroBonus = Math.floor(Math.random() * 1000)
        .toString()
        .padStart(3, "0");

    } while (selecionados.includes(numeroBonus) || numerosCache[numeroBonus]);

    db.ref("rifa/numeros/" + numeroBonus).set({
      nome: nome,
      valor: 0,
      bonus: true,
      tipo: "brinde"
    });
  }

  setTimeout(() => {
    if (vendidos.length > 0) {
      document.getElementById("modalPix").style.display = "flex";
    }

    selecionados = [];
    atualizarContador();
    fecharModal();
  }, 800);
}

// ❌ FECHAR MODAL
function fecharModal() {
  document.getElementById("modal").style.display = "none";
}

// 💳 PIX
function copiarPix() {
  const chave = document.getElementById("chavePix").innerText;

  navigator.clipboard.writeText(chave).then(() => {
    alert("Chave Pix copiada!");
  });
}

function fecharPix() {
  document.getElementById("modalPix").style.display = "none";
}

// 📅 DATA SORTEIO
function atualizarDataSabado() {
  const hoje = new Date();
  const dia = hoje.getDay();
  const diasFaltando = (6 - dia + 7) % 7;

  const proximo = new Date(hoje);
  proximo.setDate(hoje.getDate() + (diasFaltando === 0 ? 7 : diasFaltando));

  const data = proximo.toLocaleDateString("pt-BR", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });

  document.getElementById("dataSorteio").innerText =
    "Sorteio: " + data;
}

// 📱 MENU
function toggleMenu() {
  document.getElementById("menuLateral").classList.toggle("ativo");
}

// fechar menu ao clicar fora
document.addEventListener("click", function (e) {
  const menu = document.getElementById("menuLateral");
  const btn = document.getElementById("menuBtn");

  if (!menu.contains(e.target) && !btn.contains(e.target)) {
    menu.classList.remove("ativo");
  }
});

// iniciar data
atualizarDataSabado();
setInterval(atualizarDataSabado, 60000);
</script>

</body>
  </html>
