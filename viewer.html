<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador da Rifa</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
      body {
    background: radial-gradient(circle at top, #13111a, #0a0a0f);
    color: #e8ffe8;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    padding: 15px;
    text-align: center;
  }

  .status-box {
    padding: 15px;
    border-radius: 10px;
    font-weight: bold;
    margin-bottom: 20px;
    font-size: 1.1rem;
  }

  .status-pendente {
    background: rgba(255,193,7,0.15);
    color: #ffc107;
    border-left: 4px solid #ffc107;
  }

  .status-confirmado {
    background: rgba(40,167,69,0.15);
    color: #28a745;
    border-left: 4px solid #28a745;
  }

  .status-cancelado {
    background: rgba(220,53,69,0.15);
    color: #dc3545;
    border-left: 4px solid #dc3545;
  }

  .status-premiado {
    background: rgba(0,255,130,0.20);
    color: #00ff88;
    border-left: 4px solid #00ff88;
  }

  </style>
</head>
<body>

<h2>🔮 Visualizador da Rifa</h2>
<div id="box"></div>

<script>
  // ---------------- FIREBASE ----------------
  const firebaseConfig = {
    apiKey: "AIzaSyCIDFHMmzGkN3HGLn-XA8ieC_5DDBvbJ7o",
    authDomain: "rifa-782a3.firebaseapp.com",
    databaseURL: "https://rifa-782a3-default-rtdb.firebaseio.com",
    projectId: "rifa-782a3",
    storageBucket: "rifa-782a3.firebasestorage.app",
    messagingSenderId: "88068598855",
    appId: "1:88068598855:web:a230a06db76a4bbc125562"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // -------- PEGAR CÓDIGO DA URL --------
  const params = new URLSearchParams(window.location.search);
  const codigo = params.get("codigo");
  const box = document.getElementById("box");

  if (!codigo) {
    box.innerHTML = "<span style='color:red'>❌ Código não informado</span>";
    return;
  }

  carregarViewer(codigo.toUpperCase());

  // -------- VIEWER --------
  function carregarViewer(codigoBuscado) {
    const dataHoje = new Date().toISOString().slice(0, 10);

    db.ref(`compras-dia/${dataHoje}`).on("value", snap => {
      const horarios = snap.val() || {};
      let encontrado = null;

      for (let h in horarios) {
        for (let id in horarios[h]) {
          const item = horarios[h][id];

          if (item.codigo && item.codigo.toUpperCase() === codigoBuscado) {
            encontrado = { ...item, horario: h };
            break;
          }
        }
        if (encontrado) break;
      }

      if (!encontrado) {
        box.innerHTML = `<span style="color:red">❌ Nenhuma rifa encontrada com o código <b>${codigoBuscado}</b></span>`;
        return;
      }

      const numeros = encontrado.numeros || [];
      const valorPago = Number(encontrado.valorPago || 0);
      const aReceber = Number(encontrado.aReceber || 0);
      const status = encontrado.status || "pendente"; // 🔥 Lê o status

      // -------- Classe automática do status --------
      const classeStatus = "status-" + status;

      box.innerHTML = `
        <div class='linha'><b>Código:</b> ${encontrado.codigo}</div>
        <div class='linha'><b>Data/Hora:</b> ${encontrado.dataHora}</div>
        <div class='linha'><b>Números:</b> ${numeros.join(", ")}</div>

        <div class='linha'><b>Valor Pago:</b> R$ ${valorPago.toFixed(2)}</div>
        <div class='linha'><b>A Receber:</b> R$ ${aReceber.toFixed(2)}</div>

        <div class='status-box ${classeStatus}'>
          🟢 Status: <b>${status.toUpperCase()}</b>
        </div>
      `;
    });
  }
</script>

</body>
</html>
