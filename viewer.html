<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador da Rifa</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    #box {
      background: #000;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 12px;
      display: none;
    }

    .linha {
      margin: 6px 0;
      font-size: 17px;
    }

    .titulo {
      font-size: 22px;
      margin-bottom: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>🔮 Visualizador da Rifa</h2>
<div id="box"></div>

<script>
  // ---------------- FIREBASE ----------------
  const firebaseConfig = {
    apiKey: "AIzaSyCIDFHMmzGkN3HGLn-XA8ieC_5DDBvbJ7o",
    authDomain: "rifa-782a3.firebaseapp.com",
    databaseURL: "https://rifa-782a3-default-rtdb.firebaseio.com",
    projectId: "rifa-782a3",
    storageBucket: "rifa-782a3.firebasestorage.app",
    messagingSenderId: "88068598855",
    appId: "1:88068598855:web:a230a06db76a4bbc125562"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // -------- PEGAR CÓDIGO DA URL --------
  const params = new URLSearchParams(window.location.search);
  const codigo = params.get("codigo");
  const box = document.getElementById("box");

  if (!codigo) {
    box.style.display = "block";
    box.innerHTML = "<span style='color:red'>❌ Código não informado</span>";
  } else {
    carregarViewer(codigo.toUpperCase());
  }


  // -------- FUNÇÃO PRINCIPAL DA VIEWER --------
  function carregarViewer(codigoBuscado) {
    const dataHoje = new Date().toISOString().slice(0, 10);

    db.ref(`compras-dia/${dataHoje}`).once("value").then(snap => {
      const horarios = snap.val() || {};
      let encontrado = null;

      for (let h in horarios) {
        for (let id in horarios[h]) {
          const item = horarios[h][id];

          if (item.codigo && item.codigo.toUpperCase() === codigoBuscado) {
            encontrado = { ...item, horario: h };
            break;
          }
        }
        if (encontrado) break;
      }

      if (!encontrado) {
        box.style.display = "block";
        box.innerHTML = `<span style='color:red'>❌ Nenhuma rifa encontrada com o código <b>${codigoBuscado}</b></span>`;
        return;
      }

      const numeros = Array.isArray(encontrado.numeros) ? encontrado.numeros : [];
      const qtd = numeros.length;

      // Valores vindos do Firebase
      const valorPago = Number(encontrado.valorPago || 0);
      const aReceber = Number(encontrado.aReceber || 0);

      box.style.display = "block";
      box.innerHTML = `
        <div class='titulo'>🔮 Visualizador da Rifa</div>

        <div class='linha'><b>Código:</b> ${encontrado.codigo}</div>
        <div class='linha'><b>Data/Hora:</b> ${encontrado.dataHora}</div>
        <div class='linha'><b>Horário:</b> ${encontrado.horario}</div>
        <div class='linha'><b>Números (${qtd}):</b> ${numeros.join(", ")}</div><br>

        <div class='linha'><b>Valor Pago:</b> R$ ${valorPago.toFixed(2).replace('.', ',')}</div>
        <div class='linha'><b>A Receber:</b> R$ ${aReceber.toFixed(2).replace('.', ',')}</div>

        <div class='linha'><b>Status:</b> Aguardando resultado</div>
      `;
    });
  }
</script>

</body>
</html>
