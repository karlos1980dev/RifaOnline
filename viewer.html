<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador da Rifa</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    
      body {
    background: radial-gradient(circle at top, #13111a, #0a0a0f);
    color: #e8ffe8;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    padding: 15px;
    text-align: center;
  }
  @keyframes glow {
    from { box-shadow: 0 0 15px rgba(0,255,130,0.2); }
    to   { box-shadow: 0 0 35px rgba(0,255,130,0.6); }
  }

  h1 {
    color: #1aff72;
    font-size: 2.5rem;
    margin-bottom: 25px;
    text-shadow: 0 0 12px rgba(0,255,130,0.7);
    font-weight: 800;
    letter-spacing: 2px;
  }


    #box {
      background: #000;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 12px;
      display: none;
    }

    .linha {
      margin-bottom: 28px;
    padding: 15px;
    border-left: 4px solid #22ff88;
    background: rgba(0, 255, 120, 0.06);
    border-radius: 10px;
    }

    .titulo {
      width: 90%;
    margin: auto;
    padding: 25px;
    border-radius: 18px;
    background: rgba(25, 25, 35, 0.75);
    box-shadow: 0 0 30px rgba(0,255,130,0.25);
    border: 2px solid rgba(0,255,130,0.4);
    backdrop-filter: blur(10px);
    animation: glow 3s infinite alternate;
    }
    .status-box {
  padding: 15px;
  border-radius: 10px;
  font-weight: bold;
  margin-bottom: 20px;
  color: #fff;
  font-size: 1.1rem;
}

/* Status */
.status-pendente {
  background: rgba(255, 193, 7, 0.15);
  border-left: 4px solid #ffc107;
  color: #ffc107;
}

.status-confirmado {
  background: rgba(40, 167, 69, 0.15);
  border-left: 4px solid #28a745;
  color: #28a745;
}

.status-cancelado {
  background: rgba(220, 53, 69, 0.15);
  border-left: 4px solid #dc3545;
  color: #dc3545;
}

.status-premiado {
  background: rgba(0, 255, 130, 0.20);
  border-left: 4px solid #00ff88;
  color: #00ff88;
}

/* Estilo do editor */
#editorStatus {
  margin-top: 15px;
  background: #111;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #333;
  display: inline-block;
}

#selectStatus {
  padding: 10px;
  background: #000;
  color: #1aff72;
  border: 1px solid #22ff88;
  border-radius: 8px;
  font-size: 1rem;
}

#btnSalvar {
  margin-left: 10px;
  padding: 10px 16px;
  border: none;
  border-radius: 10px;
  background: #1aff72;
  color: #000;
  cursor: pointer;
  font-weight: bold;
}

#btnSalvar:hover {
  background: #22ff88;
}
  </style>
</head>
<body>

<h2>🔮 Visualizador da Rifa</h2>
<div id="box"></div>

<script>
  // ---------------- FIREBASE ----------------
  const firebaseConfig = {
    apiKey: "AIzaSyCIDFHMmzGkN3HGLn-XA8ieC_5DDBvbJ7o",
    authDomain: "rifa-782a3.firebaseapp.com",
    databaseURL: "https://rifa-782a3-default-rtdb.firebaseio.com",
    projectId: "rifa-782a3",
    storageBucket: "rifa-782a3.firebasestorage.app",
    messagingSenderId: "88068598855",
    appId: "1:88068598855:web:a230a06db76a4bbc125562"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const params = new URLSearchParams(window.location.search);
  const codigo = params.get("codigo");
  const box = document.getElementById("box");

  if (!codigo) {
    box.style.display = "block";
    box.innerHTML = "<span style='color:red'>❌ Código não informado</span>";
  } else {
    carregarViewer(codigo.toUpperCase());
  }

  // -------- VIEWER EM TEMPO REAL --------
  function carregarViewer(codigoBuscado) {
    const dataHoje = new Date().toISOString().slice(0, 10);

    db.ref(`compras-dia/${dataHoje}`).on("value", snap => {
      const horarios = snap.val() || {};
      let encontrado = null;

      for (let h in horarios) {
        for (let id in horarios[h]) {
          const item = horarios[h][id];

          if (item.codigo && item.codigo.toUpperCase() === codigoBuscado) {
            encontrado = { ...item, horario: h };
            break;
          }
        }
        if (encontrado) break;
      }

      if (!encontrado) {
        box.style.display = "block";
        box.innerHTML =
          `<span style='color:red'>❌ Nenhuma rifa encontrada com o código <b>${codigoBuscado}</b></span>`;
        return;
      }

      const numeros = Array.isArray(encontrado.numeros) ? encontrado.numeros : [];
      const qtd = numeros.length;
      const valorPago = Number(encontrado.valorPago || 0);
      const aReceber = Number(encontrado.aReceber || 0);
      const status = encontrado.status || "Aguardando resultado";

      // CLASSE DO STATUS
      let statusClass = "status-pendente";
      if (status === "Ganhou") statusClass = "status-premiado";
      if (status === "Perdeu") statusClass = "status-cancelado";
      if (status === "Cancelou") statusClass = "status-cancelado";

      box.style.display = "block";
      box.innerHTML = `
        <div class='titulo'>🔮 Visualizador da Rifa</div>

        <div class='linha'><b>Código:</b> ${encontrado.codigo}</div>
        <div class='linha'><b>Data/Hora:</b> ${encontrado.dataHora}</div>
        <div class='linha'><b>Horário:</b> ${encontrado.horario}</div>

        <div class='linha'><b>Números (${qtd}):</b> ${numeros.join(", ")}</div>

        <div class='linha'><b>Valor Pago:</b> R$ ${valorPago.toFixed(2).replace('.', ',')}</div>
        <div class='linha'><b>A Receber:</b> R$ ${aReceber.toFixed(2).replace('.', ',')}</div>

        <div class="status-box ${statusClass}">
          🔔 <b>Status:</b> ${status}
        </div>
      `;
    });
  }
</script>

</body>
</html>
