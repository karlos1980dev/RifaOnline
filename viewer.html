<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador da Rifa</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>

  /* ===== ESTILO FUTURISTA ===== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: linear-gradient(135deg, #08090c, #0f1016, #0a0f14);
    color: #e8ffe8;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h2 {
    color: #1aff72;
    font-size: 2.2rem;
    margin-bottom: 20px;
    text-shadow: 0 0 15px #00ff88;
    letter-spacing: 2px;
  }

  #box {
    width: 100%;
    max-width: 450px;
    background: rgba(0, 0, 0, 0.75);
    padding: 22px;
    border-radius: 18px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(0,255,130,0.25);
    box-shadow: 0 0 25px rgba(0,255,130,0.15);
    display: none;
  }

  .titulo {
    padding: 18px;
    margin-bottom: 20px;
    border-radius: 14px;
    font-size: 1.4rem;
    background: rgba(20, 20, 30, 0.8);
    border: 1px solid #00ff88;
    text-shadow: 0 0 10px #00ff88;
    box-shadow: 0 0 18px rgba(0,255,130,0.3);
  }

  .linha {
    margin-bottom: 18px;
    padding: 14px;
    border-left: 4px solid #22ff88;
    background: rgba(0, 255, 120, 0.08);
    border-radius: 12px;
    font-size: 1.05rem;
    line-height: 1.4rem;
  }

  @media (max-width: 480px) {
    h2 {
      font-size: 1.8rem;
    }

    #box {
      padding: 18px;
    }
  }
  </style>

</head>
<body>

<h2>🔮 Visualizador da Rifa</h2>
<div id="box"></div>

<script>
  // ---------------- FIREBASE ----------------
  const firebaseConfig = {
    apiKey: "AIzaSyCIDFHMmzGkN3HGLn-XA8ieC_5DDBvbJ7o",
    authDomain: "rifa-782a3.firebaseapp.com",
    databaseURL: "https://rifa-782a3-default-rtdb.firebaseio.com",
    projectId: "rifa-782a3",
    storageBucket: "rifa-782a3.firebasestorage.app",
    messagingSenderId: "88068598855",
    appId: "1:88068598855:web:a230a06db76a4bbc125562"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // -------- PEGAR CÓDIGO DA URL --------
  const params = new URLSearchParams(window.location.search);
  const codigo = params.get("codigo");
  const box = document.getElementById("box");

  if (!codigo) {
    box.style.display = "block";
    box.innerHTML = "<span style='color:red'>❌ Código não informado</span>";
  } else {
    carregarViewer(codigo.toUpperCase());
  }


  // -------- FUNÇÃO PRINCIPAL DA VIEWER --------
  function carregarViewer(codigoBuscado) {
    const dataHoje = new Date().toISOString().slice(0, 10);

    db.ref(`compras-dia/${dataHoje}`).once("value").then(snap => {
      const horarios = snap.val() || {};
      let encontrado = null;

      for (let h in horarios) {
        for (let id in horarios[h]) {
          const item = horarios[h][id];

          if (item.codigo && item.codigo.toUpperCase() === codigoBuscado) {
            encontrado = { ...item, horario: h };
            break;
          }
        }
        if (encontrado) break;
      }

      if (!encontrado) {
        box.style.display = "block";
        box.innerHTML = `<span style='color:red'>❌ Nenhuma rifa encontrada com o código <b>${codigoBuscado}</b></span>`;
        return;
      }

      const numeros = Array.isArray(encontrado.numeros) ? encontrado.numeros : [];
      const qtd = numeros.length;

      const valorPago = Number(encontrado.valorPago || 0);
      const aReceber = Number(encontrado.aReceber || 0);

      box.style.display = "block";
      box.innerHTML = `
        <div class='titulo'>🔮 Dados da Rifa</div>

        <div class='linha'><b>Código:</b> ${encontrado.codigo}</div>
        <div class='linha'><b>Data/Hora:</b> ${encontrado.dataHora}</div>
        <div class='linha'><b>Horário:</b> ${encontrado.horario}</div>

        <div class='linha'><b>Números (${qtd}):</b> ${numeros.join(", ")}</div>

        <div class='linha'><b>Valor Pago:</b> R$ ${valorPago.toFixed(2).replace('.', ',')}</div>
        <div class='linha'><b>A Receber:</b> R$ ${aReceber.toFixed(2).replace('.', ',')}</div>

        <div class='linha'><b>Status:</b> Aguardando resultado</div>
      `;
    });
  }
</script>

</body>
</html>
