<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Visualizador da Rifa</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
    body {
      background: #1f1c2c;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      padding: 10px;
      text-align: center;
    }
    .container {
      width: 100%;
      margin: auto;
      background-color: #2c2a3a;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .resultado {
      margin-top: 25px;
      text-align: left;
      background-color: #1e1c2c;
      padding: 15px;
      border-radius: 10px;
    }
    h3, h4 {
      color: #25d366;
      margin-bottom: 8px;
    }
    ul {
      padding-left: 20px;
    }
    li {
      margin-bottom: 5px;
    }

    /* 🔥 MILHAR EXTRA EM DESTAQUE */
    .milhar-extra-box {
      background: linear-gradient(135deg, #25d366, #0f8f45);
      color: #ffffff;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin: 25px 0;
      box-shadow: 0 0 15px rgba(37,211,102,0.6);
      font-size: 1.3rem;
      font-weight: bold;
    }
    .milhar-extra-box span {
      font-size: 1.6rem;
      text-shadow: 0 0 8px #000;
    }

    /* ESTILO DOS VALORES */
    .linha {
      margin-bottom: 12px;
    }
    .label {
      color: #25d366;
      font-weight: bold;
    }
    .value {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .status-ganhou { color: #25d366; font-weight: bold; }
    .status-perdeu { color: #ff4d4d; font-weight: bold; }
    .status-aguardando { color: #ffd700; font-weight: bold; }
    .status-cancelou { color: #0099ff; font-weight: bold; }
</style>

</head>
<body>

<div class="container">
  <h3>🔍 Visualizador da Rifa</h3>

  <div id="resultado" class="resultado" style="display:none;">
    <div class="linha">
      <span class="label">Código</span><br>
      <span class="value" id="codigoValor"></span>
    </div>
    <div class="linha">
      <span class="label">Nome</span><br>
      <span class="value" id="nomeValor"></span>
    </div>
    <div class="linha">
      <span class="label">Números</span><br>
      <span class="value" id="numerosValor"></span>
    </div>
    <div class="linha">
      <span class="label">Horário</span><br>
      <span class="value" id="horarioValor"></span>
    </div>
    <div class="linha">
      <span class="label">Data e Hora</span><br>
      <span class="value" id="dataHoraValor"></span>
    </div>
    <div class="linha">
      <span class="label">Status</span><br>
      <span class="value" id="statusValor"></span>
    </div>
  </div>

  <h4 id="message"></h4>
</div>

<script>
  /* CONFIG FIREBASE */
  const firebaseConfig = {
    apiKey: "AIzaSyCIDFHMmzGkN3HGLn-XA8ieC_5DDBvbJ7o",
    authDomain: "rifa-782a3.firebaseapp.com",
    databaseURL: "https://rifa-782a3-default-rtdb.firebaseio.com",
    projectId: "rifa-782a3",
    storageBucket: "rifa-782a3.firebasestorage.app",
    messagingSenderId: "88068598855",
    appId: "1:88068598855:web:a230a06db6a4bbc125562"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  /* PEGAR CÓDIGO DA URL */
  const params = new URLSearchParams(window.location.search);
  const codigo = params.get("codigo");

  const resultadoDiv = document.getElementById("resultado");
  const messageDiv = document.getElementById("message");

  if (!codigo) {
    messageDiv.textContent = "❌ Nenhum código informado.";
  } else {
    messageDiv.textContent = "Carregando...";

    db.ref("rifas/" + codigo).once("value")
    .then(snap => {
        if (!snap.exists()) {
          messageDiv.textContent = "❌ Código não encontrado.";
          return;
        }

        const dados = snap.val();

        document.getElementById("codigoValor").textContent = dados.codigoCliente;
        document.getElementById("nomeValor").textContent = dados.nome;
        document.getElementById("numerosValor").textContent = dados.numeros.join(", ");
        document.getElementById("horarioValor").textContent = dados.horario;
        document.getElementById("dataHoraValor").textContent = dados.dataHora;

        const statusEl = document.getElementById("statusValor");
        statusEl.textContent = dados.status;

        statusEl.className = "value status-" + dados.status.toLowerCase();

        resultadoDiv.style.display = "block";
        messageDiv.textContent = "";
    });
  }
</script>

</body>
</html>
