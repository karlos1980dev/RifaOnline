<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Visualizador da Rifa</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
  body {
    background: radial-gradient(circle at top, #13111a, #0a0a0f);
    color: #e8ffe8;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    padding: 15px;
    text-align: center;
  }

  #container {
    width: 90%;
    margin: auto;
    padding: 25px;
    border-radius: 18px;
    background: rgba(25, 25, 35, 0.75);
    box-shadow: 0 0 30px rgba(0,255,130,0.25);
    border: 2px solid rgba(0,255,130,0.4);
    backdrop-filter: blur(10px);
    animation: glow 3s infinite alternate;
  }

  @keyframes glow {
    from { box-shadow: 0 0 15px rgba(0,255,130,0.2); }
    to   { box-shadow: 0 0 35px rgba(0,255,130,0.6); }
  }

  h1 {
    color: #1aff72;
    font-size: 2.5rem;
    margin-bottom: 25px;
    text-shadow: 0 0 12px rgba(0,255,130,0.7);
    font-weight: 800;
    letter-spacing: 2px;
  }

  .linha {
    margin-bottom: 28px;
    padding: 15px;
    border-left: 4px solid #22ff88;
    background: rgba(0, 255, 120, 0.06);
    border-radius: 10px;
  }

  .label {
    font-size: 1.1rem;
    color: #111;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
  }

  .value {
    margin-top: 6px;
    font-size: 1.8rem;
    font-weight: 900;
    color: #fafafa;
    text-shadow: 0 0 10px #00ff88;
    word-break: break-word;
  }

  .status-ganhou { color: #00ff99; text-shadow: 0 0 15px #00ff99; }
  .status-perdeu { color: #ff3b3b; text-shadow: 0 0 10px #ff2a2a; }
  .status-cancelou { color: #2da8ff; text-shadow: 0 0 10px #1b8fff; }
  .status-aguardando { color: #ffe44d; text-shadow: 0 0 10px #ffdd33; }

  #message {
    font-size: 1.5rem;
    margin-top: 25px;
    color: #1aff72;
    font-weight: 600;
    text-shadow: 0 0 10px rgba(0,255,130,0.5);
  }
</style>

</head>
<body>

<div id="container">
  <h1>🔮 Visualizador da Rifa</h1>

  <div id="resultado" style="display:none;">
    <div class="linha">
      <span class="label">Código</span>
      <span class="value" id="codigoValor"></span>
    </div>

    <div class="linha">
      <span class="label">Data e Hora : </span>
      <span class="value" id="dataHoraValor"></span>
    </div>

    <div class="linha">
      <span class="label">Nome : </span>
      <span class="value" id="nomeValor"></span>
    </div>

    <div class="linha">
      <span class="label">Horário : </span>
      <span class="value" id="horarioValor"></span>
    </div>

    <div class="linha">
      <span class="label">Números : </span>
      <span class="value" id="numerosValor"></span>
    </div>

    <div class="linha">
      <span class="label"> Status : </span>
      <span class="value" id="statusValor"> Aguardando resultado : </span>
    </div>
  </div>

  <div id="message"></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCIDFHMmzGkN3HGLn-XA8ieC_5DDBvbJ7o",
    authDomain: "rifa-782a3.firebaseapp.com",
    databaseURL: "https://rifa-782a3-default-rtdb.firebaseio.com",
    projectId: "rifa-782a3",
    storageBucket: "rifa-782a3.firebasestorage.app",
    messagingSenderId: "88068598855",
    appId: "1:88068598855:web:a230a06db6a4bbc125562"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const codigoValor = document.getElementById("codigoValor");
  const nomeValor = document.getElementById("nomeValor");
  const numerosValor = document.getElementById("numerosValor");
  const horarioValor = document.getElementById("horarioValor");
  const dataHoraValor = document.getElementById("dataHoraValor");
  const statusValor = document.getElementById("statusValor");
  const resultadoDiv = document.getElementById("resultado");
  const messageDiv = document.getElementById("message");

  function getParametro(nome) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(nome);
  }

  function atualizarStatus(texto) {
    statusValor.textContent = texto;
    statusValor.className = "value";

    if (texto.toLowerCase().includes("ganhou"))
      statusValor.classList.add("status-ganhou");
    else if (texto.toLowerCase().includes("perdeu"))
      statusValor.classList.add("status-perdeu");
    else if (texto.toLowerCase().includes("cancelou"))
      statusValor.classList.add("status-cancelou");
    else
      statusValor.classList.add("status-aguardando");
  }

  const codigoParam = getParametro("codigo");

  if (!codigoParam) {
    messageDiv.textContent = "⚠ Nenhum código informado.";
  } else {
    messageDiv.textContent = "🔍 Buscando informações...";

    db.ref("compras-dia").once("value").then(snapshot => {
      let encontrado = null;
      let horarioEncontrado = "";

      snapshot.forEach(diaSnap => {
        diaSnap.forEach(horarioSnap => {
          horarioSnap.forEach(reservaSnap => {
            const dados = reservaSnap.val();
            if (dados.codigo === codigoParam) {
              encontrado = dados;
              horarioEncontrado = horarioSnap.key;
              return true;
            }
          });
          if (encontrado) return true;
        });
        if (encontrado) return true;
      });

      if (encontrado) {
        codigoValor.textContent = encontrado.codigo;
        nomeValor.textContent = encontrado.nome;
        numerosValor.textContent = encontrado.numeros.join(", ");
        horarioValor.textContent = horarioEncontrado;
        dataHoraValor.textContent = encontrado.dataHora;

        atualizarStatus(encontrado.status || "Aguardando resultado");

        resultadoDiv.style.display = "block";
        messageDiv.textContent = "";

      } else {
        messageDiv.textContent = "❌ Código não encontrado.";
      }
    });
  }
</script>

</body>
</html>
