<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <meta name="theme-color" content="#10172b"> <title>MAIS PIX - PAINEL ADMINISTRATIVO</title> <style> *{box-sizing:border-box} body{ margin:0; background:#0b1020; color:#fff; font-family:Arial,Helvetica,sans-serif; } header{ text-align:center; padding:22px 12px; background:linear-gradient(135deg,#182445,#10172b); border-bottom:1px solid #ffffff18; } header h2{color:#f5ca61;margin:0} header p{color:#aab5d0;font-size:12px} .container{max-width:760px;margin:auto;padding:15px} .box{ background:#151e36; border:1px solid #ffffff15; padding:15px; border-radius:14px; margin:14px 0; } .box h3{margin:0 0 14px;color:#f5ca61} .item{ background:#0e1830; border:1px solid #ffffff15; padding:13px; border-radius:11px; margin:10px 0; overflow-wrap:anywhere; } .item b{color:#fff} .info{ font-size:12px; color:#aab5d0; line-height:1.8; margin-top:7px; } input{ width:100%; padding:12px; margin:6px 0; border-radius:8px; border:1px solid #394969; background:#101a31; color:white; outline:none; } button{ padding:11px 13px; margin:4px 2px; border:0; border-radius:8px; cursor:pointer; font-weight:bold; } button:disabled{opacity:.5;cursor:not-allowed} .aprovar{background:#00c853;color:#fff} .recusar{background:#ff1744;color:#fff} .remover{background:#ff9100;color:#111} .editar{background:#2979ff;color:#fff} .liberar{background:#00b0ff;color:#fff} .desligar{background:#555;color:#fff} .neutro{background:#344563;color:#fff} .status{ padding:12px; border-radius:9px; background:#0e1830; margin-top:10px; font-weight:bold; font-size:13px; } img.comprovante{ display:block; width:100%; max-width:260px; max-height:350px; object-fit:contain; background:#fff; border-radius:8px; margin:10px auto; } .link{color:#8ebaff;word-break:break-all} .empty{padding:20px;text-align:center;color:#aab5d0} .contagem{color:#aab5d0;font-size:13px;line-height:2} .aviso{ background:#392c13; color:#ffdc91; padding:10px; border-radius:8px; font-size:12px; line-height:1.6; margin-top:10px; } @media(max-width:420px){ .container{padding:9px} .box{padding:12px} button{font-size:12px} } </style> </head> <body> <header> <h2>⚙️ MAIS PIX</h2> <p>PAINEL ADMINISTRATIVO</p> </header> <div class="container"> <div class="box"> <h3>🔐 Controle de entrada</h3> <button class="liberar" onclick="liberarEntrada(true)"> LIBERAR ENTRADA </button> <button class="desligar" onclick="liberarEntrada(false)"> FECHAR ENTRADA </button> <div class="status" id="statusEntrada"> Carregando... </div> </div> <div class="box"> <h3>📊 Resumo</h3> <div class="contagem"> Solicitações pendentes: <b id="qtdPendentes">0</b><br> Participantes ativos: <b id="qtdAtivos">0</b><br> Comprovantes recebidos: <b id="qtdComprovantes">0</b> </div> </div> <div class="box"> <h3>⏳ Solicitações pendentes</h3> <div id="pendentes"> <div class="empty">Carregando...</div> </div> </div> <div class="box"> <h3>👥 Participantes ativos</h3> <div id="lista"> <div class="empty">Carregando...</div> </div> </div> <div class="box"> <h3>🧾 Comprovantes recebidos</h3> <div id="comprovantes"> <div class="empty">Carregando...</div> </div> </div> </div> <script type="module"> import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; import { getDatabase, ref, onValue, push, get, remove, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"; /* FIREBASE */ const firebaseConfig={ apiKey:"AIzaSyCnqXmiLEMzH-GUN3nEkkdOTv_xrbxUj2A", authDomain:"tudoaqui-b1d09.firebaseapp.com", databaseURL:"https://tudoaqui-b1d09-default-rtdb.firebaseio.com", projectId:"tudoaqui-b1d09", storageBucket:"tudoaqui-b1d09.appspot.com", messagingSenderId:"588034588401", appId:"1:588034588401:web:4731b181a31c4a354fb350" }; const app=initializeApp(firebaseConfig); const db=getDatabase(app); const pendentesRef=ref(db,"pendentes"); const listaRef=ref(db,"lista"); const configRef=ref(db,"config/entradaLiberada"); const comprovantesRef=ref(db,"comprovantes"); const MAX_ATIVOS=6; let pendentes={}; let ativos={}; let comprovantes={}; let operacoesEmAndamento=new Set(); /* UTILITÁRIOS */ function esc(valor){ return String(valor??"").replace(/[&<>"']/g,c=>({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]); } function dataHora(timestamp){ if(!timestamp)return "Data não informada"; const data=new Date(Number(timestamp)); return isNaN(data.getTime()) ?"Data inválida" :data.toLocaleString("pt-BR"); } function mostrarErro(erro){ console.error("ERRO FIREBASE:",erro); const codigo=erro?.code||"desconhecido"; const mensagem=erro?.message||String(erro); alert( "ERRO NA OPERAÇÃO\n\n"+ "Código: "+codigo+ "\nDetalhes: "+mensagem+ (codigo==="PERMISSION_DENIED" ?"\n\nVerifique as regras de acesso do Firebase." :"") ); } function bloquearBotao(botao,bloquear){ if(botao)botao.disabled=bloquear; } /* EXCLUIÇÃO COM VERIFICAÇÃO. O caminho deve ser um dos caminhos definidos pelo sistema. */ async function excluirFirebase(caminho){ const registroRef=ref(db,caminho); const antes=await get(registroRef); if(!antes.exists()){ return false; } await remove(registroRef); const depois=await get(registroRef); if(depois.exists()){ throw new Error( "O registro continua existindo após a tentativa de exclusão." ); } return true; } /* CONTROLE DE ENTRADA */ window.liberarEntrada=async function(status){ try{ await set(configRef,status); alert(status ?"Entrada liberada!" :"Entrada fechada!" ); }catch(e){ mostrarErro(e); } }; onValue(configRef,snap=>{ const liberada=snap.val()===true; document.getElementById("statusEntrada").textContent= liberada ?"🟢 ENTRADA LIBERADA" :"🔴 ENTRADA FECHADA"; },mostrarErro); /* RESUMO */ function atualizarResumo(){ document.getElementById("qtdPendentes").textContent= Object.keys(pendentes).length; document.getElementById("qtdAtivos").textContent= Object.keys(ativos).length; document.getElementById("qtdComprovantes").textContent= Object.keys(comprovantes).length; } /* PENDENTES */ onValue(pendentesRef,snapshot=>{ pendentes=snapshot.val()||{}; renderPendentes(); atualizarResumo(); },mostrarErro); function renderPendentes(){ const div=document.getElementById("pendentes"); div.innerHTML=""; const itens=Object.entries(pendentes) .sort((a,b)=> Number(a[1].timestamp||0)-Number(b[1].timestamp||0) ); if(!itens.length){ div.innerHTML='<div class="empty">Nenhuma solicitação pendente.</div>'; return; } itens.forEach(([id,item],index)=>{ const el=document.createElement("div"); el.className="item"; el.innerHTML=` <b>${index+1}º - ${esc(item.nome||"Sem nome")}</b> <div class="info"> <b>Chave Pix:</b> ${esc(item.chave||"Não informada")}<br> <b>Data:</b> ${esc(dataHora(item.timestamp))}<br> <b>Cliente:</b> ${esc(item.clienteId||"Não informado")}<br> <b>Status:</b> ${esc(item.status||"PENDENTE")} </div> <button class="aprovar" data-acao="aprovar">APROVAR</button> <button class="recusar" data-acao="recusar">RECUSAR</button> `; el.querySelector('[data-acao="aprovar"]').onclick= ()=>aprovar(id); el.querySelector('[data-acao="recusar"]').onclick= ()=>recusar(id); div.appendChild(el); }); } /* APROVAR */ window.aprovar=async function(id){ if(operacoesEmAndamento.has(id))return; const solicitacao=pendentes[id]; if(!solicitacao){ alert("Solicitação não encontrada."); return; } if(!solicitacao.chave){ alert("Esta solicitação não possui chave Pix."); return; } if(!confirm("Deseja aprovar este participante?"))return; operacoesEmAndamento.add(id); try{ const snap=await get(listaRef); const dados=snap.val()||{}; if(Object.keys(dados).length>=MAX_ATIVOS){ alert("A lista de participantes ativos já está cheia."); return; } /* Mantém os dados completos do participante, inclusive a chave Pix e o clienteId. */ const registro={ ...solicitacao, nome:solicitacao.nome||"", chave:solicitacao.chave, clienteId:solicitacao.clienteId||"", timestamp:Date.now(), status:"ATIVO" }; const novoRef=push(listaRef); await set(novoRef,registro); /* Só remove o pendente depois de salvar o ativo. */ await remove(ref(db,"pendentes/"+id)); alert("Participante aprovado com sucesso!"); }catch(e){ mostrarErro(e); }finally{ operacoesEmAndamento.delete(id); } }; /* RECUSAR PENDENTE */ window.recusar=async function(id){ if(operacoesEmAndamento.has(id))return; if(!confirm("Deseja excluir esta solicitação pendente?"))return; operacoesEmAndamento.add(id); try{ const excluido=await excluirFirebase("pendentes/"+id); if(!excluido){ alert("Solicitação não encontrada."); return; } alert("Solicitação excluída com sucesso!"); }catch(e){ mostrarErro(e); }finally{ operacoesEmAndamento.delete(id); } }; /* LISTA ATIVA */ onValue(listaRef,snapshot=>{ ativos=snapshot.val()||{}; renderLista(); atualizarResumo(); },mostrarErro); function renderLista(){ const div=document.getElementById("lista"); div.innerHTML=""; const itens=Object.entries(ativos) .sort((a,b)=> Number(a[1].timestamp||0)-Number(b[1].timestamp||0) ); if(!itens.length){ div.innerHTML='<div class="empty">Lista vazia.</div>'; return; } itens.forEach(([key,item],index)=>{ const el=document.createElement("div"); el.className="item"; el.innerHTML=` <b>${index+1}º PARTICIPANTE</b> <label class="info">Nome</label> <input class="campo-nome" maxlength="70" value="${esc(item.nome||"")}"> <label class="info">Chave Pix</label> <input class="campo-chave" maxlength="120" value="${esc(item.chave||"")}"> <div class="info"> Cliente: ${esc(item.clienteId||"Não informado")}<br> Data: ${esc(dataHora(item.timestamp))} </div> <button class="editar" data-acao="salvar"> SALVAR ALTERAÇÕES </button> <button class="remover" data-acao="remover"> REMOVER PARTICIPANTE </button> `; const campoNome=el.querySelector(".campo-nome"); const campoChave=el.querySelector(".campo-chave"); el.querySelector('[data-acao="salvar"]').onclick= ()=>editar(key,campoNome.value,campoChave.value); el.querySelector('[data-acao="remover"]').onclick= ()=>removerItem(key); div.appendChild(el); }); } /* EDITAR PARTICIPANTE */ window.editar=async function(key,nome,chave){ nome=String(nome||"").trim(); chave=String(chave||"").trim(); if(nome.length<3||chave.length<5){ alert("Confira o nome e a chave Pix."); return; } try{ await update(ref(db,"lista/"+key),{ nome:nome, chave:chave }); alert("Participante atualizado!"); }catch(e){ mostrarErro(e); } }; /* REMOVER PARTICIPANTE ATIVO */ window.removerItem=async function(key){ if(operacoesEmAndamento.has(key))return; const participante=ativos[key]; if(!participante){ alert("Participante não encontrado."); return; } const nome=participante.nome||"Participante"; if(!confirm( "Deseja excluir definitivamente este participante?\n\n"+ nome+ "\n\nEle será removido da lista ativa no Firebase." ))return; operacoesEmAndamento.add(key); try{ const excluido=await excluirFirebase("lista/"+key); if(!excluido){ alert("Este participante já foi excluído."); return; } /* O listener onValue atualiza a tela automaticamente. */ alert("Participante "+nome+" excluído com sucesso!"); }catch(e){ mostrarErro(e); }finally{ operacoesEmAndamento.delete(key); } }; /* COMPROVANTES */ onValue(comprovantesRef,snapshot=>{ comprovantes=snapshot.val()||{}; renderComprovantes(); atualizarResumo(); },mostrarErro); function renderComprovantes(){ const div=document.getElementById("comprovantes"); div.innerHTML=""; const itens=Object.entries(comprovantes) .sort((a,b)=> Number(b[1].timestamp||0)-Number(a[1].timestamp||0) ); if(!itens.length){ div.innerHTML='<div class="empty">Nenhum comprovante recebido.</div>'; return; } itens.forEach(([id,item])=>{ const el=document.createElement("div"); el.className="item"; const nome=item.nomeParticipante||item.nome||"Participante"; const url=String(item.url||""); const imagem= /\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(url); el.innerHTML=` <b>${esc(nome)}</b> <div class="info"> Participante: ${esc(item.participanteId||"")}<br> Chave Pix: ${esc(item.chavePix||"")}<br> Data: ${esc(dataHora(item.timestamp))}<br> Status: ${esc(item.status||"PENDENTE")} </div> ${ url ?` <a class="link" href="${esc(url)}" target="_blank" rel="noopener"> ABRIR COMPROVANTE </a> ${imagem ?`<img class="comprovante" src="${esc(url)}" alt="Comprovante">` :"" } ` :"<p>Arquivo sem endereço disponível.</p>" } <button class="aprovar" data-acao="aprovar"> CONFIRMAR COMPROVANTE </button> <button class="recusar" data-acao="excluir"> EXCLUIR COMPROVANTE </button> `; el.querySelector('[data-acao="aprovar"]').onclick= ()=>aprovarComprovante(id); el.querySelector('[data-acao="excluir"]').onclick= ()=>recusarComprovante(id); div.appendChild(el); }); } /* CONFIRMAR COMPROVANTE */ window.aprovarComprovante=async function(id){ if(!confirm("Confirma que verificou o pagamento no banco?"))return; try{ const caminho=ref(db,"comprovantes/"+id); const snap=await get(caminho); if(!snap.exists()){ alert("Comprovante não encontrado."); return; } await update(caminho,{ status:"CONFERIDO", conferidoEm:Date.now() }); alert("Comprovante marcado como conferido."); }catch(e){ mostrarErro(e); } }; /* EXCLUIR COMPROVANTE */ window.recusarComprovante=async function(id){ if(operacoesEmAndamento.has(id))return; if(!confirm("Deseja excluir definitivamente este comprovante?"))return; operacoesEmAndamento.add(id); try{ const excluido=await excluirFirebase("comprovantes/"+id); if(!excluido){ alert("Comprovante não encontrado."); return; } alert("Comprovante excluído com sucesso!"); }catch(e){ mostrarErro(e); }finally{ operacoesEmAndamento.delete(id); } }; </script> </body> </html>
