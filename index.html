<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="shortcut icon" type="image/jpg" href="https://github.dev/karlos1980dev/RifaOnline/blob/main/images-2.jpg">
  <link rel="icon" href="https://github.dev/karlos1980dev/RifaOnline/blob/main/images-2.jpg" type="image/jpeg">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
        font-family: Arial, sans-serif;
        background: #232;
        color:#fff;
        margin:0;
        padding-top: 70px;
        text-align:center;
    }

    /* TOPO */
    #topoWrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background:#8098ff;
        display:flex;
        align-items:center;
        justify-content: space-between;
        padding:8px 10px;
        gap:10px;
        z-index:1000;
        border-bottom:2px solid #000;
    }

    #btnMenu {
        background:#000;
        color:#fff;
        padding:6px 12px;
        font-size:20px;
        border:none;
        border-radius:8px;
        cursor:pointer;
        flex-shrink: 0;
    }

    /* GRUPO DE INPUTS */
    #topoInputs {
        display:flex;
        align-items:center;
        gap:8px;
        flex-wrap: nowrap;
        width:100%;
        justify-content:flex-end;
    }

    #topoInputs input,
    #topoInputs select {
        padding:6px;
        font-size:14px;
        border-radius:6px;
        border:none;
        background:#222;
        color:#fff;
        text-align:center;
    }

    #valor { width:90px; }
    #horarios { width:120px !important; }

    #salvar {
        width:80px;
        background:#2ecc71;
        border:none;
        padding:6px 10px;
        border-radius:8px;
        color:#fff;
        cursor:pointer;
    }

    /* MENU LATERAL */
    #menu {
    margin:0;
        position: fixed;
        top: 50px;
        left: -100%;
        width: 90%;
        height: 80%;
        background:#111;
        color:#fff;
        padding:10px;
        transition:0.3s;
        overflow-y:auto;
        z-index:9999;
    }

    #menu.open { left:0; }

    #menu textarea {
    margin-top:30px;
        display:block;
        width:100%;
        height:300px;
        margin-top:10px;
        background:#000;
        color:#fff;
        border:none;
        border-radius:10px;
        padding:10px;
        box-sizing:border-box;
        white-space:pre-wrap;
    }

    /* NÚMEROS */
    #numeros {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      width: 100%;
      padding: 5px;
      box-sizing: border-box;
    }

    .numero {
      aspect-ratio: 1 / 1;
      width: 100%;
      border-radius: 8px;
      background: #3498db;
      color: #fff;
      border: none;
      font-weight: bold;
      font-size: clamp(8px, 3.3vw, 18px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .marcado { background:#27ae60 !important; }
    .bloqueado { background:#777 !important; color:#ccc; cursor:not-allowed; }

    #totalPagar { color:gold; font-weight:bold; }

    @media (max-width: 420px) {
        #topoInputs { gap:5px; }
        #valor { width:70px; }
        #horarios { width:90px !important; }
        #salvar { padding:6px 8px; font-size:12px; }
    }
  </style>
</head>
<body>

<h1>Rifa Online <strong style="color:red;">1</strong> pra <strong style="color:red;">70</strong></h1>

<div id="topoWrapper">
  <button id="btnMenu" onclick="toggleMenu()">☰</button>
  <div id="topoInputs">
    <input style="width:90px" type="number" id="valor" placeholder="R$" min="0" step="0.01">
    <select id="horarios" style="width:120px">
      <option value="" disabled selected>HORÁRIO</option>
      <option value="10:00">10:00</option>
      <option value="12:00">12:00</option>
      <option value="15:00">15:00</option>
      <option value="19:00">19:00</option>
      <option value="21:00">21:00</option>
    </select>
    <button id="salvar">Salvar</button>
  </div>
</div>

<div>
    <strong>Total a pagar: R$ <span id="totalPagar">0,00</span></strong>
</div>

<!-- MENU LATERAL -->
<div id="menu" aria-hidden="true">
  <h3>Reservas do dia</h3>
  <textarea id="codigo" readonly>Nenhuma reserva carregada.</textarea>
</div>

<!-- Conteúdo principal -->
<div id="conteudo" style="padding:12px;">
  <div id="numeros"></div>
  <div>
    <strong>Você recebe: R$ <span id="totalReceber">0,00</span></strong>
  </div>
</div>

<script>
  /* FIREBASE CONFIG */
  const firebaseConfig = {
    apiKey: "AIzaSyCIDFHMmzGkN3HGLn-XA8ieC_5DDBvbJ7o",
    authDomain: "rifa-782a3.firebaseapp.com",
    databaseURL: "https://rifa-782a3-default-rtdb.firebaseio.com",
    projectId: "rifa-782a3",
    storageBucket: "rifa-782a3.firebasestorage.app",
    messagingSenderId: "88068598855",
    appId: "1:88068598855:web:a230a06db76a4bbc125562"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  /* ELEMENTOS */
  const numerosDiv = document.getElementById('numeros');
  const valorInput = document.getElementById('valor');
  const codigoTextarea = document.getElementById('codigo'); // já existe no DOM
  const horariosSelect = document.getElementById('horarios');
  const totalPagarSpan = document.getElementById('totalPagar');
  const menuEl = document.getElementById('menu');

  let selecionados = [];
  let bloqueados = new Set();
  let dataAtualReservas = new Date().toISOString().slice(0,10);

  /* CRIA 00 A 99 */
  for (let i = 0; i < 100; i++) {
    let num = i.toString().padStart(2, '0');
    let btn = document.createElement('button');
    btn.textContent = num;
    btn.className = 'numero';
    btn.addEventListener('click', () => toggleNumero(btn, num));
    numerosDiv.appendChild(btn);
  }

  /* FUNÇÕES DE UI */
  function toggleMenu(){
    menuEl.classList.toggle('open');
    menuEl.setAttribute('aria-hidden', menuEl.classList.contains('open') ? 'false' : 'true');
    // quando abrir, carregar reservas do dia atual (atualiza textarea)
    if (menuEl.classList.contains('open')) carregarReservasDoDia(dataAtualReservas);
  }

  function toggleNumero(btn,num){
    if(btn.classList.contains("bloqueado")) return;

    if(btn.classList.contains("marcado")){
      btn.classList.remove("marcado");
      selecionados = selecionados.filter(n=>n!==num);
    } else {
      btn.classList.add("marcado");
      selecionados.push(num);
    }
    atualizarTotais();
  }

  function atualizarTotalPagar() {
    let valorUnit = parseFloat(valorInput.value.replace(',', '.'));
    if (isNaN(valorUnit) || valorUnit <= 0) valorUnit = 0;
    const total = valorUnit * selecionados.length;
    totalPagarSpan.textContent = total.toFixed(2).replace('.', ',');
  }

  /* BLOQUEIOS */
  function atualizarBloqueados() {
    db.ref('numerosBloqueados').once('value').then(snapshot => {
      bloqueados = new Set();
      const dados = snapshot.val() || {};
      for (let n in dados) {
        if (dados[n] === true || (dados[n] && dados[n].bloqueadoEm)) bloqueados.add(n);
      }
      atualizarBotoes();
    }).catch(err => console.error(err));
  }

  function atualizarBotoes() {
    document.querySelectorAll('.numero').forEach(btn => {
      const n = btn.textContent;
      if (bloqueados.has(n)) {
        btn.classList.add('bloqueado');
        btn.classList.remove('marcado');
        btn.disabled = true;
        selecionados = selecionados.filter(x => x !== n);
      } else {
        btn.classList.remove('bloqueado');
        btn.disabled = false;
      }
    });
    atualizarTotais();
  }

  /* CARREGA RESERVAS DO DIA (preenche textarea) */
  function atualizarTextareaReservas(dadosPorHorario) {
    // protege contra null/undefined
    if (!dadosPorHorario || Object.keys(dadosPorHorario).length === 0) {
      if (codigoTextarea) codigoTextarea.value = "Nenhuma reserva para hoje.";
      return;
    }

    let texto = "";
    for (let horario of Object.keys(dadosPorHorario).sort()) {
      texto += `Horário: ${horario}\n`;
      for (let key in dadosPorHorario[horario]) {
        const d = dadosPorHorario[horario][key];
        // protege contra dados inesperados
        const numeros = Array.isArray(d.numeros) ? d.numeros.join("-") : (d.numeros || "");
        const dataHora = d.dataHora || "";
        texto += `${dataHora} -  ${numeros}\n`;
      }
      texto += "---------------------------------\n";
    }
    if (codigoTextarea) codigoTextarea.value = texto;
  }

  function carregarReservasDoDia(data) {
    // protege se textarea ausente
    if (!codigoTextarea) return;

    db.ref(`compras-dia/${data}`).once('value').then(snapshot => {
      const dadosPorHorario = snapshot.val() || {};
      atualizarTextareaReservas(dadosPorHorario);
    }).catch(err => {
      console.error(err);
      codigoTextarea.value = "Erro ao carregar reservas.";
    });
  }

  /* LIMPAR BLOQUEIOS ANTIGOS (>24h) */
  function limparBloqueiosAntigos(){
    const agora = Date.now();
    const limite = 24 * 60 * 60 * 1000;
    db.ref("numerosBloqueados").once("value").then(snap => {
      const dados = snap.val() || {};
      for (let n in dados) {
        const item = dados[n];
        const bloqueadoEm = (item && item.bloqueadoEm) ? item.bloqueadoEm : null;
        if (bloqueadoEm && (agora - bloqueadoEm >= limite)) {
          db.ref("numerosBloqueados/" + n).remove().catch(e => console.error(e));
        }
      }
      atualizarBloqueados();
    }).catch(e => console.error(e));
  }

  /* HORARIOS */
  function getHoraAtual() {
    const now = new Date();
    let h = now.getHours();
    let m = now.getMinutes();
    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
  }

  function atualizarHorarios() {
    const horarios = Array.from(horariosSelect.options);
    const horaAtual = getHoraAtual();
    for (let opt of horarios) {
      if (!opt.value) continue;
      opt.disabled = false;
      opt.selected = false;
      if (opt.value <= horaAtual) opt.disabled = true;
    }
    for (let opt of horarios) {
      if (!opt.disabled && !opt.selected && opt.value) { opt.selected = true; break; }
    }
  }

  /* GERA CÓDIGO SIMPLES */
  function gerarCodigoSimples() {
    const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    return `RIFA-${letras[Math.floor(Math.random() * letras.length)]}${letras[Math.floor(Math.random() * letras.length)]}${Math.floor(100 + Math.random() * 900)}`;
  }

  /* SALVAR RESERVA */
  document.getElementById('salvar').addEventListener('click', () => {
    if (selecionados.length === 0) return alert("Selecione pelo menos um número!");
    const horario = horariosSelect.value;
    if (!horario) return alert("Selecione um horário!");
    let valorUnit = parseFloat(valorInput.value.replace(',', '.'));
    if (isNaN(valorUnit) || valorUnit <= 0) return alert("Digite um valor válido maior que zero!");

    db.ref('numerosBloqueados').once('value').then(snapshot => {
      const bloqueios = snapshot.val() || {};
      const conflito = selecionados.find(n => bloqueios[n] === true || (bloqueios[n] && bloqueios[n].bloqueadoEm));
      if (conflito) {
        alert(`O número ${conflito} já foi reservado. Lista atualizada.`);
        atualizarBloqueados();
        return;
      }

      const codigoSimples = gerarCodigoSimples();
      const chave = "ID-" + Date.now();
      const dataHoje = new Date().toISOString().slice(0,10);
      const dataHora = new Date().toLocaleString();
      const dados = { numeros: [...selecionados], dataHora, codigo: codigoSimples, valorUnitario: valorUnit };

      let promessas = [];
      promessas.push(db.ref(`compras-dia/${dataHoje}/${horario}/${chave}`).set(dados));
      selecionados.forEach(n => promessas.push(db.ref(`numerosBloqueados/${n}`).set({ bloqueadoEm: Date.now() })));

      Promise.all(promessas).then(() => {
        alert("Reserva feita com sucesso!");
        carregarReservasDoDia(dataHoje);
        atualizarBloqueados();

        const telefoneDestino = "5571992290058";
        const mensagem = `🍀 *Rifa Online*\n\nCódigo do jogo: ${codigoSimples}`;
        window.open(`https://wa.me/${telefoneDestino}?text=${encodeURIComponent(mensagem)}`, '_blank');

        selecionados = [];
        document.querySelectorAll('.numero.marcado').forEach(b => b.classList.remove('marcado'));
        totalPagarSpan.textContent = '0,00';
        horariosSelect.selectedIndex = -1;
      }).catch(err=>{
        console.error(err);
        alert('Erro ao salvar: ' + (err.message || err));
      });
    });
  });

  /* inicializações */
  atualizarBloqueados();
  carregarReservasDoDia(dataAtualReservas);
  limparBloqueiosAntigos();
  setInterval(limparBloqueiosAntigos, 60000);
  setInterval(atualizarBloqueados, 15000);
  valorInput.addEventListener('input', atualizarTotais);
  atualizarHorarios();
  setInterval(atualizarHorarios, 60000);

  function atualizarTotais() {
    let v = parseFloat(document.getElementById("valor").value.replace(",", "."));
    if (isNaN(v) || v <= 0) v = 0;
    let quantidade = selecionados.length;
    let pagar = v * quantidade;
    let receber = v * 70;
    totalPagarSpan.textContent = pagar.toFixed(2).replace(".", ",");
    document.getElementById("totalReceber").textContent =
        receber.toFixed(2).replace(".", ",");
  }
  document.getElementById("valor").oninput = atualizarTotais;

</script>
</body>
</html>
