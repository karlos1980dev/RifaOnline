<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    #grid-numeros {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      max-width: 360px;
      margin: 0 auto 20px auto;
    }
    .item-numero {
      background: #333;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 6px #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .numero-texto {
      font-size: 1.4rem;
      font-weight: bold;
    }
    .bloqueado {
      background: #c0392b;
      color: #fff;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .liberado {
      background: #27ae60;
      color: #fff;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    #reservasContainer {
      max-width: 700px;
      margin: 0 auto;
      text-align: left;
      background: #111;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 0 10px #000;
      color: #0f0;
      font-family: monospace;
      font-size: 1rem;
      max-height: 450px;
      overflow-y: auto;
    }
    .reserva-item {
      padding: 10px;
      border-bottom: 1px solid #333;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .reserva-dados {
      flex-grow: 1;
    }
    .reserva-label {
      font-weight: bold;
      color: #aaffaa;
      margin-right: 6px;
    }
    select.status-select {
      background: #222;
      color: #0f0;
      border-radius: 6px;
      border: 1px solid #0f0;
      padding: 4px 8px;
      font-weight: bold;
      min-width: 130px;
    }
    button.salvar-status-btn {
      background: #2980b9;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>

  <title>Painel ADM - Bloquear/Desbloquear</title>
</head>
<body>

<h1>Painel Bloquear/Desbloquear Números</h1>

<div id="grid-numeros"></div>

<h2>Reservas do Dia Atual</h2>
<div id="reservasContainer">Carregando reservas...</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCIDFHMmzGkN3HGLn-XA8ieC_5DDBvbJ7o",
    authDomain: "rifa-782a3.firebaseapp.com",
    databaseURL: "https://rifa-782a3-default-rtdb.firebaseio.com",
    projectId: "rifa-782a3",
    storageBucket: "rifa-782a3",
    messagingSenderId: "88068598855",
    appId: "1:88068598855:web:a230a06db76a4bbc125562"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const grid = document.getElementById('grid-numeros');
  const reservasContainer = document.getElementById('reservasContainer');

  function getDataHoje() {
    return new Date().toISOString().slice(0, 10);
  }

  // LIMPAR RESERVA AO LIBERAR
  function limparReservasPorNumero(numero) {
    const dataHoje = getDataHoje();

    return db.ref(`compras-dia/${dataHoje}`).once('value').then(snapshot => {
      const horarios = snapshot.val() || {};
      let updates = {};

      for (const horario in horarios) {
        const reservas = horarios[horario];

        for (const codigo in reservas) {
          const reserva = reservas[codigo];

          if (reserva.numeros.includes(numero)) {
            const novos = reserva.numeros.filter(n => n !== numero);

            if (novos.length === 0) {
              updates[`compras-dia/${dataHoje}/${horario}/${codigo}`] = null;
            } else {
              updates[`compras-dia/${dataHoje}/${horario}/${codigo}/numeros`] = novos;
            }
          }
        }
      }

      return db.ref().update(updates);
    });
  }

  // CARREGAR RESERVAS DO DIA
  function carregarReservasDoDia() {
    const dataHoje = getDataHoje();
    reservasContainer.innerHTML = "Carregando reservas...";

    db.ref(`compras-dia/${dataHoje}`).once('value').then(snapshot => {
      const dados = snapshot.val() || {};

      if (!Object.keys(dados).length) {
        reservasContainer.textContent = "Nenhuma reserva registrada hoje.";
        return;
      }

      reservasContainer.innerHTML = "";

      for (const horario of Object.keys(dados).sort()) {
        const blocoH = document.createElement("div");
        blocoH.innerHTML = `<h3 style="color:#7fff7f;">Horário: ${horario}</h3>`;

        const reservas = dados[horario];

        for (const cod in reservas) {
          const r = reservas[cod];

          const item = document.createElement("div");
          item.className = "reserva-item";

          // EXIBIÇÃO COMPLETA COM STATUS
          item.innerHTML = `
            <div class="reserva-dados">
              <span class="reserva-label">Nome:</span> ${r.nome}<br>
              <span class="reserva-label">Números:</span> ${r.numeros.join(", ")}<br>
              <span class="reserva-label">Código:</span> ${r.codigo}<br>
              <span class="reserva-label">Status:</span> ${(r.status || "Aguardando resultado")}
            </div>
          `;

          // SELECT DE STATUS
          const select = document.createElement("select");
          select.className = "status-select";

          ["Aguardando resultado", "Ganhou", "Perdeu", "Cancelou"].forEach(st => {
            const op = document.createElement("option");
            op.value = st;
            op.textContent = st;
            if ((r.status || "Aguardando resultado") === st) op.selected = true;
            select.appendChild(op);
          });

          const btn = document.createElement("button");
          btn.className = "salvar-status-btn";
          btn.textContent = "Salvar status";

          btn.onclick = () => {
            db.ref(`compras-dia/${dataHoje}/${horario}/${cod}/status`)
              .set(select.value)
              .then(() => {
                alert("Status atualizado!");
                carregarReservasDoDia();
              });
          };

          item.appendChild(select);
          item.appendChild(btn);
          blocoH.appendChild(item);
        }

        reservasContainer.appendChild(blocoH);
      }
    });
  }

  // CARREGAR NUMERAÇÃO
  function carregarNumeros() {
    db.ref("numerosBloqueados").once("value").then(snapshot => {
      const bloqueios = snapshot.val() || {};
      grid.innerHTML = "";

      for (let i = 0; i < 100; i++) {
        let num = i.toString().padStart(2, "0");
        let bloqueado = bloqueios[num] === true;

        let item = document.createElement("div");
        item.className = "item-numero";

        let botaoClass = bloqueado ? "bloqueado" : "liberado";
        let botaoTexto = bloqueado ? "Desbloquear" : "Bloquear";

        item.innerHTML = `
          <span class="numero-texto">${num}</span>
          <button class="${botaoClass}" data-num="${num}" data-bloqueado="${bloqueado}">
            ${botaoTexto}
          </button>
        `;

        grid.appendChild(item);
      }

      document.querySelectorAll("#grid-numeros button").forEach(btn => {
        btn.onclick = () => {
          const numero = btn.getAttribute("data-num");
          const estadoAtual = btn.getAttribute("data-bloqueado") === "true";
          const novoEstado = !estadoAtual;

          db.ref("numerosBloqueados/" + numero).set(novoEstado).then(() => {
            btn.setAttribute("data-bloqueado", novoEstado);
            btn.textContent = novoEstado ? "Desbloquear" : "Bloquear";
            btn.className = novoEstado ? "bloqueado" : "liberado";

            if (!novoEstado) {
              limparReservasPorNumero(numero).then(() => carregarReservasDoDia());
            }
          });
        };
      });
    });
  }

  carregarNumeros();
  carregarReservasDoDia();
</script>

</body>
</html>
